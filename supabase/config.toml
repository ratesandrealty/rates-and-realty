# verify_jwt = true, so with no Authorization header the gateway 401s the run
# before the function is reached. The anon key identifies nobody; the cron secret
# is the credential.
#
# ENFORCED since 2026-08-07. The run observed first, then the guard: the
# 2026-08-06 22:00 weekday run carried the header and landed rates (fetched
