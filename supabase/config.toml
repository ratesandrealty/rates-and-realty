# UNAUTHORIZED_NO_AUTH_HEADER for days with nothing alerting.
#
# false because people.html calls this from the browser with the user's session
# token and the function does its own auth. It is on the list in
# docs/PINNED-NOT-GUARDED.md for a proper in-function guard; pinning it here
