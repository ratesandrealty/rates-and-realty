# Supabase project config.
# Edge functions that serve external webhooks must NOT require a Supabase JWT,
# or the gateway 401s the (unauthenticated) inbound request before it reaches the
# function. `supabase functions deploy` defaults verify_jwt back to true unless the
# function is pinned here.

[functions.sms-assistant]
# Twilio posts the staff-line (888) SMS/MMS webhook here with no auth header.
verify_jwt = false

[functions.portal-data]
# The borrower portal (unified-portal.html) calls this with NO Supabase JWT — it must
# stay verify_jwt=false or the portal 401s and every borrower-facing surface breaks.
verify_jwt = false

[functions.gmail-inbox]
# CRM inbox backend. MUST require a Supabase JWT — the function resolves the caller's
# role from it and hard-gates which Gmail mailbox (rene@ vs processing@) they may touch.
verify_jwt = true

[functions.compose-ai]
# Composer AI assistant. MUST require a Supabase JWT — it reads borrower loan data and
# Gmail thread contents, and gates both on the role resolved from that JWT. Note this
# is deliberately UNLIKE sms-draft-assist (verify_jwt=false, no role guard) — do not
# "make it consistent" by relaxing this.
verify_jwt = true
