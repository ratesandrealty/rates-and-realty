<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>VA Help Videos — Rates & Realty CRM</title>
<script src="/api/env.js?v=2026033003"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/admin/js/supabase-client.js?v=2026050601"></script>

<style>
  :root {
    --gold: #c9a84c;
    --bg: #0d0d0d;
    --surface: #141414;
    --surface2: #1a1a1a;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #fff;
    --text-muted: rgba(255,255,255,0.4);
    --green: #52c87a;
    --red: #e05252;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

  .header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; background: var(--surface);
    border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  .header h1 { font-size: 16px; font-weight: 700; flex-shrink: 0; }
  .header-right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .header-right .who { font-size: 12px; color: var(--text-muted); }
  .btn-back {
    padding: 6px 12px; background: rgba(255,255,255,0.06);
    border: 1px solid var(--border); border-radius: 7px;
    color: var(--text-muted); font-size: 12px; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
  }

  .wrap { max-width: 760px; margin: 0 auto; padding: 22px 16px 80px; }
  .intro { font-size: 13px; color: rgba(255,255,255,0.7); line-height: 1.6; margin-bottom: 20px; }
  .intro strong { color: var(--gold); }

  .loading, .empty, .denied { text-align: center; padding: 50px 20px; color: var(--text-muted); font-size: 13px; }
  .denied .emoji, .empty .emoji { font-size: 34px; display: block; margin-bottom: 12px; }

  /* Topic card */
  .vh-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 16px;
  }
  .vh-card-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
  .vh-title { font-size: 15px; font-weight: 700; }
  .vh-key {
    font-size: 10px; color: var(--text-muted); font-family: ui-monospace, monospace;
    text-transform: uppercase; letter-spacing: 0.4px; margin-top: 3px;
  }
  .vh-status { margin-left: auto; font-size: 11px; color: var(--gold); display: flex; align-items: center; gap: 6px; }
  .vh-status.err { color: var(--red); }
  .vh-status.ok { color: var(--green); }

  .vh-video { margin-bottom: 12px; }
  .vh-video video { width: 100%; max-height: 46vh; border-radius: 10px; background: #000; display: block; }
  .vh-novideo {
    font-size: 12px; color: var(--text-muted); background: var(--surface2);
    border: 1px dashed var(--border2); border-radius: 10px;
    padding: 22px 16px; text-align: center; margin-bottom: 12px;
  }

  .vh-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .vh-btn {
    padding: 8px 14px; background: rgba(201,168,76,0.14);
    border: 1px solid rgba(201,168,76,0.4); border-radius: 8px;
    color: var(--gold); font-size: 12px; font-weight: 700; cursor: pointer;
    font-family: inherit; white-space: nowrap;
  }
  .vh-btn:hover { background: rgba(201,168,76,0.22); }
  .vh-btn:disabled { opacity: 0.5; cursor: default; }
  .vh-btn.danger { background: rgba(224,82,82,0.12); border-color: rgba(224,82,82,0.4); color: #ff7b7b; }
  .vh-btn.danger:hover { background: rgba(224,82,82,0.2); }

  .spin {
    display: inline-block; width: 12px; height: 12px; vertical-align: middle;
    border: 2px solid rgba(201,168,76,0.3); border-top-color: var(--gold);
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Recorder overlay (ported from the staff-chat recorder) */
  .rec-ov { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; padding: 18px; }
  .rec-box { width: min(460px, 94vw); background: #0d0d0d; border: 1px solid rgba(201,168,76,0.3); border-radius: 14px; overflow: hidden; box-shadow: 0 20px 56px rgba(0,0,0,0.6); display: flex; flex-direction: column; }
  .rec-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 13px; font-weight: 700; color: var(--gold); }
  .rec-x { background: transparent; border: none; color: #888; font-size: 16px; cursor: pointer; padding: 4px 7px; border-radius: 6px; line-height: 1; font-family: inherit; }
  .rec-x:hover { color: #fff; background: rgba(255,255,255,0.06); }
  .rec-menu { display: flex; flex-direction: column; gap: 8px; padding: 16px; }
  .rec-opt { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); color: #eee; border-radius: 8px; padding: 12px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; text-align: left; }
  .rec-opt:hover { background: rgba(255,255,255,0.09); }
  .rec-preview { width: 100%; max-height: 50vh; background: #000; display: block; }
  .rec-audiowrap { padding: 24px 18px; display: flex; justify-content: center; }
  .rec-audio-el { width: 100%; }
  .rec-audio { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 34px 18px; color: #ddd; font-size: 13px; font-weight: 600; }
  .rec-ctrl { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid rgba(255,255,255,0.08); }
  .rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); animation: blink 1s steps(2,start) infinite; flex-shrink: 0; }
  @keyframes blink { 50% { opacity: 0.25; } }
  .rec-timer { font-size: 12px; color: #ddd; flex: 1; }
  .rec-stop { background: var(--red); border: none; color: #fff; font-weight: 700; font-size: 12px; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-family: inherit; }
  .rec-msg { padding: 20px 18px; color: #e6c9a0; font-size: 13px; line-height: 1.5; text-align: center; }
  .rec-discard { flex: 1; }
  .rec-save { background: var(--gold); border: none; color: #111; font-weight: 700; font-size: 12px; border-radius: 8px; padding: 8px 16px; cursor: pointer; font-family: inherit; }

  /* Toast */
  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px);
    z-index: 120; background: #1a1a1a; border: 1px solid rgba(201,168,76,0.4); color: #fff;
    font-size: 12.5px; padding: 9px 14px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    opacity: 0; transition: opacity 0.25s, transform 0.25s; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { border-color: rgba(224,82,82,0.5); }
</style>
  <link rel="stylesheet" href="/public/css/responsive-global.css">
</head>
<body>

<div class="header">
  <a href="va-tasks.html" class="btn-back">← Back to tasks</a>
  <h1>🎥 VA Help Videos</h1>
  <div class="header-right">
    <span class="who" id="adminUserEmail"></span>
    <button class="btn-back" onclick="window.adminLogout && window.adminLogout()">Log out</button>
  </div>
</div>

<div class="wrap">
  <div class="intro">
    Record or upload a short <strong>how-to explainer</strong> for each VA help topic. Whatever you save
    here appears above the help text when a VA taps that topic's <strong>ℹ️</strong> info button.
  </div>
  <div id="topicList"><div class="loading"><span class="spin"></span> Loading topics…</div></div>
</div>

<input type="file" id="vhFile" accept="video/*" style="display:none">
<div class="toast" id="toast"></div>

<script>
'use strict';

var BUCKET = 'video-messages';
var MAX_BYTES = 100 * 1024 * 1024;   // 100 MB, same ceiling as chat recording
var _supabase = null;
var _topics = [];
var _uploadKey = null;               // topic key awaiting a file-picker result
var _rec = null;                     // recorder state
var _recKey = null;                  // topic key the recorder is capturing for
var _busy = {};                      // key → true while an upload/remove is in flight

function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

function toast(msg, isErr) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.toggle('err', !!isErr); t.classList.add('show');
  setTimeout(function () { t.classList.remove('show'); }, 3000);
}

// ── init + admin gate ─────────────────────────────────────────────────────
async function init() {
  try { _supabase = await window.getSupabaseClient(); }
  catch (e) { document.getElementById('topicList').innerHTML = '<div class="empty">Could not connect. Please refresh.</div>'; return; }
  try {
    var u = await _supabase.auth.getUser();
    if (u && u.data && u.data.user && u.data.user.email) document.getElementById('adminUserEmail').textContent = u.data.user.email;
  } catch (e) {}
  gateAdmin();
}

// The video RPCs are admin-gated server-side; this is the UX gate so non-admins
// see a clear message instead of a broken page. Poll until the role resolves.
function gateAdmin(attempt) {
  attempt = attempt || 0;
  var role = (sessionStorage.getItem('rnr_app_role') || '').toLowerCase();
  if (role) {
    if (role !== 'admin') {
      document.getElementById('topicList').innerHTML =
        '<div class="denied"><span class="emoji">🔒</span>Admins only. Ask Rene if you need access.</div>';
      return;
    }
    loadTopics();
    return;
  }
  if (attempt >= 40) { loadTopics(); return; }   // ~6s ceiling, then try anyway (RPC still enforces)
  setTimeout(function () { gateAdmin(attempt + 1); }, 150);
}

async function loadTopics() {
  try {
    var r = await _supabase.rpc('va_help_list');
    if (r.error) throw r.error;
    _topics = (r.data || []).slice().sort(function (a, b) { return (a.sort_order || 0) - (b.sort_order || 0); });
    renderTopics();
  } catch (e) {
    console.error('[va-help] list failed', e);
    document.getElementById('topicList').innerHTML =
      '<div class="empty">Could not load help topics.' + (e && e.message ? '<br><span style="font-size:11px;">' + esc(e.message) + '</span>' : '') + '</div>';
  }
}

function topicCardHtml(t) {
  var hasVideo = !!(t.video_url && String(t.video_url).trim());
  var vid = hasVideo
    ? '<div class="vh-video"><video controls preload="metadata" playsinline src="' + esc(t.video_url) + '"></video></div>'
    : '<div class="vh-novideo">No explainer video yet.</div>';
  var remove = hasVideo ? '<button class="vh-btn danger" data-remove="' + esc(t.key) + '">🗑 Remove</button>' : '';
  return '<div class="vh-card" data-card="' + esc(t.key) + '">'
    + '<div class="vh-card-head"><div><div class="vh-title">' + esc(t.title || t.key) + '</div>'
    +   '<div class="vh-key">' + esc(t.key) + '</div></div>'
    +   '<span class="vh-status" data-status="' + esc(t.key) + '"></span></div>'
    + vid
    + '<div class="vh-actions">'
    +   '<button class="vh-btn" data-record="' + esc(t.key) + '">🎥 Record</button>'
    +   '<button class="vh-btn" data-upload="' + esc(t.key) + '">⬆️ Upload file</button>'
    +   remove
    + '</div></div>';
}

function renderTopics() {
  var host = document.getElementById('topicList');
  if (!_topics.length) { host.innerHTML = '<div class="empty">No help topics found.</div>'; return; }
  host.innerHTML = _topics.map(topicCardHtml).join('');
}

function setStatus(key, msg, cls) {
  var el = document.querySelector('[data-status="' + cssq(key) + '"]');
  if (el) { el.className = 'vh-status' + (cls ? ' ' + cls : ''); el.innerHTML = msg || ''; }
}
function cssq(s) { return String(s).replace(/["\\]/g, '\\$&'); }

function setCardBusy(key, busy) {
  _busy[key] = busy;
  var card = document.querySelector('[data-card="' + cssq(key) + '"]');
  if (card) Array.prototype.forEach.call(card.querySelectorAll('.vh-btn'), function (b) { b.disabled = busy; });
}

// ── save path: upload → public URL → va_help_set_video → refresh row ──────
async function saveVideoFor(key, file) {
  if (_busy[key]) return;
  if (file.size > MAX_BYTES) { toast('“' + file.name + '” is over 100 MB', true); return; }
  setCardBusy(key, true);
  setStatus(key, '<span class="spin"></span> Uploading…');
  try {
    var ext = extOf(file);
    var path = 'va-help/' + key + '-' + crypto.randomUUID() + '.' + ext;
    var up = await _supabase.storage.from(BUCKET).upload(path, file, { contentType: file.type || 'video/webm', upsert: false });
    if (up.error) throw up.error;
    var pub = _supabase.storage.from(BUCKET).getPublicUrl(path);
    var publicUrl = pub && pub.data && pub.data.publicUrl;
    if (!publicUrl) throw new Error('Could not resolve public URL');
    var r = await _supabase.rpc('va_help_set_video', { p_key: key, p_video_url: publicUrl });
    if (r.error) throw r.error;
    // Reflect locally + re-render just this card.
    var t = _topics.filter(function (x) { return x.key === key; })[0];
    if (t) { t.video_url = publicUrl; refreshCard(key); }
    setCardBusy(key, false);
    setStatus(key, '✓ Saved', 'ok');
    toast('Explainer saved');
    setTimeout(function () { setStatus(key, ''); }, 2500);
  } catch (e) {
    console.error('[va-help] save failed', e);
    setCardBusy(key, false);
    setStatus(key, '⚠ ' + ((e && e.message) || 'Failed'), 'err');
    toast('Save failed: ' + ((e && e.message) || 'error'), true);
  }
}

function refreshCard(key) {
  var card = document.querySelector('[data-card="' + cssq(key) + '"]');
  var t = _topics.filter(function (x) { return x.key === key; })[0];
  if (card && t) {
    var tmp = document.createElement('div');
    tmp.innerHTML = topicCardHtml(t);
    card.replaceWith(tmp.firstChild);
  }
}

function extOf(file) {
  var name = String(file.name || '');
  var m = name.match(/\.([A-Za-z0-9]{2,5})$/);
  if (m) return m[1].toLowerCase();
  var ty = (file.type || '').toLowerCase();
  if (ty.indexOf('mp4') > -1) return 'mp4';
  if (ty.indexOf('quicktime') > -1) return 'mov';
  return 'webm';
}

// Best-effort delete of the previously-stored object (only if it lives in our bucket).
async function removeVideoFor(key) {
  if (_busy[key]) return;
  if (!confirm('Remove the explainer video for this topic?')) return;
  var t = _topics.filter(function (x) { return x.key === key; })[0];
  var oldUrl = t ? t.video_url : '';
  setCardBusy(key, true);
  setStatus(key, '<span class="spin"></span> Removing…');
  try {
    var r = await _supabase.rpc('va_help_set_video', { p_key: key, p_video_url: '' });
    if (r.error) throw r.error;
    var objPath = bucketPathFromUrl(oldUrl);
    if (objPath) { try { await _supabase.storage.from(BUCKET).remove([objPath]); } catch (e) { /* non-fatal */ } }
    if (t) { t.video_url = ''; refreshCard(key); }
    setCardBusy(key, false);
    setStatus(key, '');
    toast('Explainer removed');
  } catch (e) {
    console.error('[va-help] remove failed', e);
    setCardBusy(key, false);
    setStatus(key, '⚠ ' + ((e && e.message) || 'Failed'), 'err');
    toast('Remove failed: ' + ((e && e.message) || 'error'), true);
  }
}

function bucketPathFromUrl(url) {
  var u = String(url || '');
  var marker = '/storage/v1/object/public/' + BUCKET + '/';
  var i = u.indexOf(marker);
  if (i === -1) return null;
  return decodeURIComponent(u.slice(i + marker.length).split('?')[0]);
}

// ════════════════════════════════════════════════════════════════════════
// RECORDER — ported from the staff-chat recorder (camera / screen / audio).
// ════════════════════════════════════════════════════════════════════════
function openRecordMenu(key) {
  _recKey = key;
  closeRecordUi();
  var ov = document.createElement('div'); ov.className = 'rec-ov'; ov.id = 'rec-ov';
  ov.innerHTML = '<div class="rec-box"></div>';
  document.body.appendChild(ov);
  showRecMenu();
}
function showRecMenu() {
  stopRecording();
  var box = document.querySelector('#rec-ov .rec-box'); if (!box) return;
  box.innerHTML = '<div class="rec-head"><span>Record explainer</span><button type="button" class="rec-x" data-rec-cancel>✕</button></div>'
    + '<div class="rec-menu">'
    + '<button type="button" class="rec-opt" data-rec-start="camera">🎥 Record camera + mic (myself)</button>'
    + '<button type="button" class="rec-opt" data-rec-start="screen">🖥️ Record screen (with mic)</button>'
    + '<button type="button" class="rec-opt" data-rec-start="audio">🎙️ Record audio only</button>'
    + '</div>';
}
function stopTracks() { if (_rec && _rec.stream) { try { _rec.stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} } }
function closeRecordUi() {
  stopRecording();
  if (_rec && _rec.previewUrl) { try { URL.revokeObjectURL(_rec.previewUrl); } catch (e) {} }
  var ov = document.getElementById('rec-ov'); if (ov) ov.remove();
  _rec = null;
}
function recPermError(box, mode) {
  stopTracks();
  var msg = (mode === 'screen')
    ? 'Screen sharing was blocked or cancelled. Go back and try again.'
    : 'Allow camera & microphone for this site in your browser settings, then try again.';
  box.innerHTML = '<div class="rec-head"><span>Permission needed</span><button type="button" class="rec-x" data-rec-cancel>✕</button></div>'
    + '<div class="rec-msg">🔒 ' + esc(msg) + '</div>'
    + '<div class="rec-ctrl"><button type="button" class="rec-opt rec-discard" data-rec-menu>← Back</button></div>';
}
async function beginRecording(mode) {
  var box = document.querySelector('#rec-ov .rec-box'); if (!box) return;
  if (!navigator.mediaDevices) { recPermError(box, mode); return; }
  var isAudio = (mode === 'audio'), stream;
  try {
    if (mode === 'screen') {
      stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      try { var mic = await navigator.mediaDevices.getUserMedia({ audio: true }); mic.getAudioTracks().forEach(function (t) { stream.addTrack(t); }); } catch (e) { /* mic optional */ }
    } else if (isAudio) {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } else {
      stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    }
  } catch (e) { recPermError(box, mode); return; }
  var recMime = isAudio ? 'audio/webm' : 'video/webm';
  var useMime = (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(recMime)) ? recMime : '';
  var recorder;
  try { recorder = useMime ? new MediaRecorder(stream, { mimeType: useMime }) : new MediaRecorder(stream); }
  catch (e) { toast('Recording is not supported in this browser', true); try { stream.getTracks().forEach(function (t) { t.stop(); }); } catch (x) {} return; }
  var chunks = [];
  recorder.ondataavailable = function (ev) { if (ev.data && ev.data.size) chunks.push(ev.data); };
  recorder.onstop = function () { showRecPreview(new Blob(chunks, { type: recMime })); };
  _rec = { recorder: recorder, stream: stream, mode: mode, isAudio: isAudio, timer: null, blob: null, previewUrl: null };
  box.innerHTML = '<div class="rec-head"><span>Recording…</span><button type="button" class="rec-x" data-rec-cancel>✕</button></div>'
    + (isAudio
        ? '<div class="rec-audio"><span class="rec-dot"></span> Recording audio…</div>'
        : '<video class="rec-preview" autoplay muted playsinline></video>')
    + '<div class="rec-ctrl">' + (isAudio ? '' : '<span class="rec-dot"></span>') + '<span class="rec-timer" id="rec-timer">0:00</span>'
    + '<button type="button" class="rec-stop" data-rec-stop>■ Stop</button></div>';
  if (!isAudio) { var v = box.querySelector('.rec-preview'); if (v) v.srcObject = stream; }
  try { recorder.start(); } catch (e) { toast('Could not start recording', true); closeRecordUi(); return; }
  var secs = 0;
  _rec.timer = setInterval(function () {
    secs++; var t = document.getElementById('rec-timer');
    if (t) t.textContent = Math.floor(secs / 60) + ':' + ('0' + (secs % 60)).slice(-2);
  }, 1000);
}
function stopRecording() {
  if (_rec && _rec.recorder && _rec.recorder.state !== 'inactive') { try { _rec.recorder.stop(); } catch (e) {} }
  if (_rec && _rec.timer) { clearInterval(_rec.timer); _rec.timer = null; }
  stopTracks();
}
function showRecPreview(blob) {
  var box = document.querySelector('#rec-ov .rec-box'); if (!box || !_rec) return;
  var url = URL.createObjectURL(blob); _rec.blob = blob; _rec.previewUrl = url;
  box.innerHTML = '<div class="rec-head"><span>Preview</span><button type="button" class="rec-x" data-rec-cancel>✕</button></div>'
    + (_rec.isAudio
        ? '<div class="rec-audiowrap"><audio class="rec-audio-el" controls src="' + url + '"></audio></div>'
        : '<video class="rec-preview" controls playsinline src="' + url + '"></video>')
    + '<div class="rec-ctrl"><button type="button" class="rec-opt rec-discard" data-rec-menu>↺ Redo</button>'
    + '<button type="button" class="rec-save" data-rec-save>Save explainer</button></div>';
}
async function saveRecording() {
  if (!_rec || !_rec.blob || !_recKey) return;
  var isAudio = _rec.isAudio, mode = _rec.mode, blob = _rec.blob, key = _recKey;
  var base = isAudio ? 'audio' : (mode === 'screen' ? 'screen' : 'video');
  var file = new File([blob], base + '.webm', { type: isAudio ? 'audio/webm' : 'video/webm' });
  closeRecordUi();
  await saveVideoFor(key, file);
}

// ── events ────────────────────────────────────────────────────────────────
document.addEventListener('click', function (e) {
  var recBtn = e.target.closest('[data-record]'); if (recBtn) { openRecordMenu(recBtn.getAttribute('data-record')); return; }
  var upBtn = e.target.closest('[data-upload]'); if (upBtn) { _uploadKey = upBtn.getAttribute('data-upload'); document.getElementById('vhFile').click(); return; }
  var rmBtn = e.target.closest('[data-remove]'); if (rmBtn) { removeVideoFor(rmBtn.getAttribute('data-remove')); return; }
  // recorder overlay controls
