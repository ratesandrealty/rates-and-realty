<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video — Rates &amp; Realty</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A5%3C/text%3E%3C/svg%3E">
<script src="/api/env.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --gold:#c9a84c; --bg:#0a0a0a; --surface:#141414; --text:#fff; --muted:rgba(255,255,255,.55); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { min-height:100%; }
  body {
    background:radial-gradient(ellipse at top, #16130c 0%, var(--bg) 60%);
    color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex; flex-direction:column; min-height:100vh;
  }
  .topbar { display:flex; align-items:center; gap:9px; padding:16px 20px; }
  .brand { font-size:15px; font-weight:800; letter-spacing:.3px; }
  .brand .amp { color:var(--gold); }

  .main { flex:1; display:flex; align-items:center; justify-content:center; padding:12px 16px 40px; }
  .card { width:100%; max-width:900px; }

  .player {
    background:#000; border:1px solid rgba(201,168,76,.22); border-radius:16px;
    overflow:hidden; box-shadow:0 24px 70px rgba(0,0,0,.55); aspect-ratio:16/9;
    display:flex; align-items:center; justify-content:center;
  }
  .player video { width:100%; height:100%; display:block; background:#000; }
  .player.audio { aspect-ratio:auto; padding:40px 24px; }
  .player.audio audio { width:100%; }

  .meta { margin-top:18px; padding:0 4px; }
  .title { font-size:20px; font-weight:700; line-height:1.35; }
  .sub { font-size:12.5px; color:var(--muted); margin-top:6px; }

  .state { text-align:center; padding:70px 20px; color:var(--muted); }
  .state .emoji { font-size:46px; display:block; margin-bottom:16px; }
  .state h1 { font-size:19px; color:#fff; font-weight:700; margin-bottom:8px; }
  .state p { font-size:13.5px; line-height:1.6; }
  .spin {
    display:inline-block; width:22px; height:22px; border:3px solid rgba(201,168,76,.28);
    border-top-color:var(--gold); border-radius:50%; animation:spin .75s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  .foot { text-align:center; padding:22px 16px 30px; color:rgba(255,255,255,.4); font-size:11.5px; }
  .foot a { color:var(--gold); text-decoration:none; }
  @media (max-width:520px){ .title{font-size:17px} .player{border-radius:12px} }
</style>
</head>
<body>
  <div class="topbar">
    <span class="brand">Rates <span class="amp">&amp;</span> Realty</span>
  </div>

  <div class="main">
    <div class="card" id="card">
      <div class="state"><span class="spin"></span></div>
    </div>
  </div>

  <div class="foot">Shared securely via <a href="/">Rates &amp; Realty</a></div>

<script>
(function () {
  'use strict';
  var card = document.getElementById('card');

  function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function qp(name) { try { return new URLSearchParams(location.search).get(name); } catch (e) { return null; } }

  function showState(emoji, heading, text) {
    card.innerHTML = '<div class="state"><span class="emoji">' + emoji + '</span><h1>' + esc(heading) + '</h1><p>' + esc(text) + '</p></div>';
  }

  function fmtDate(iso) {
    try { var d = new Date(iso); if (isNaN(d.getTime())) return ''; return d.toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' }); }
    catch (e) { return ''; }
  }
  function fmtDur(s) {
    s = Number(s) || 0; if (!s) return '';
    var m = Math.floor(s / 60), sec = s % 60;
    return m + ':' + ('0' + sec).slice(-2);
  }

  function render(v) {
    document.title = (v.title || 'Video') + ' — Rates & Realty';
    var url = v.public_url;
    var isAudio = (v.mime_type || '').toLowerCase().indexOf('audio') === 0;
    var player = isAudio
      ? '<div class="player audio"><audio controls preload="metadata" src="' + esc(url) + '"></audio></div>'
      : '<div class="player"><video controls preload="metadata" playsinline src="' + esc(url) + '"></video></div>';
    var bits = [];
    if (v.duration_seconds) bits.push(fmtDur(v.duration_seconds));
    if (v.created_at) bits.push(fmtDate(v.created_at));
    card.innerHTML = player
      + '<div class="meta"><div class="title">' + esc(v.title || 'Untitled video') + '</div>'
      + (bits.length ? '<div class="sub">' + esc(bits.join(' · ')) + '</div>' : '')
      + '</div>';
  }

  async function load() {
    var slug = qp('v');
    if (!slug) { showState('🔗', 'No video specified', 'This link is missing its video id.'); return; }

    var cfg = window.APP_CONFIG || {};
    if (!window.supabase || !cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY) {
      showState('⚠️', 'Could not load', 'The video service is temporarily unavailable. Please try again shortly.');
      return;
    }
    try {
      var sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
      var r = await sb.rpc('video_get_public', { p_slug: slug });
      if (r.error) throw r.error;
      var v = r.data;
      if (Array.isArray(v)) v = v[0];
      if (!v || !v.found || !v.public_url) {
        showState('🎬', 'Video not available', 'This video may have been removed or the link is incorrect.');
        return;
      }
      render(v);
    } catch (e) {
      console.error('[watch] load failed', e);
      showState('⚠️', 'Could not load the video', 'Something went wrong. Please try again shortly.');
    }
  }

  load();
})();
</script>
</body>
</html>
