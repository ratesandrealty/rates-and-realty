<!DOCTYPE html>
<!-- va-inbox.html · cache-buster v=2026072401 (Worker serves /admin/* HTML no-store) -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Inbox — Rates & Realty CRM</title>
<script src="/api/env.js?v=2026033003"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/admin/js/supabase-client.js?v=5e7926468b"></script>
<script src="/admin/js/auth-guard.js?v=dba3278ab9"></script>
<script src="/admin/js/presence.js?v=4378247c6d"></script>
<link rel="stylesheet" href="/public/css/responsive-global.css">
<link rel="stylesheet" href="/public/css/crm-mobile.css">
<style>
  :root {
    --gold: #c9a84c; --bg: #0d0d0d; --surface: #141414; --surface2: #1a1a1a;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
    --text: #fff; --text-muted: rgba(255,255,255,0.4); --muted: rgba(255,255,255,0.4);
    --green: #52c87a; --red: #e05252;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* Fixed-height app shell: header, then the inbox filling the rest. The page itself
     never scrolls — the thread list and reading pane own scrolling. */
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100%; overflow: hidden; display: flex; flex-direction: column; }
  a { color: inherit; }
  .header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; flex-shrink: 0; }
  .header h1 { font-size: 16px; font-weight: 700; flex-shrink: 0; }
  .portal-nav { display: flex; gap: 6px; }
  .nav-link { padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; text-decoration: none; color: var(--text-muted); border: 1px solid var(--border); background: rgba(255,255,255,0.03); }
  .nav-link:hover { color: #fff; }
  .nav-link.active { color: #000; background: var(--gold); border-color: var(--gold); }
  .header-right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .header-right .who { font-size: 12px; color: var(--text-muted); }
  .btn-back { padding: 6px 12px; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 7px; color: var(--text-muted); font-size: 12px; cursor: pointer; text-decoration: none; }
  .btn-back:hover { color:#fff; }
  /* Was max-width:1180px;margin:0 auto — that centred gutter is the dead space beside
     the inbox. The left rail lives in that reclaimed width instead of adding to it. */
  .wrap { flex: 1; min-height: 0; display: flex; padding: 10px 12px 12px; }
  #inboxHost { flex: 1; min-width: 0; min-height: 0; display: flex; }
  .page-title { font-size: 16px; font-weight: 800; margin-bottom: 12px; }
  .page-title small { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-left: 8px; }
  @media (max-width:768px){ .header{padding:10px 12px} .wrap{padding:0} body{overflow:auto} }
</style>
</head>
<body>

<div class="header">
  <div class="portal-nav">
    <a href="va-dashboard.html" class="nav-link">📊 Dashboard</a>
    <a href="va-tasks.html" class="nav-link">✅ My Tasks</a>
    <a href="/admin/chat.html" class="nav-link">💬 Chat</a>
    <a href="va-inbox.html" class="nav-link active">📥 Inbox</a>
  </div>
  <h1 style="margin-left:4px;">Inbox</h1>
  <div class="header-right">
    <span class="who" id="adminUserEmail"></span>
    <button class="btn-back" onclick="window.adminLogout && window.adminLogout()">Log out</button>
  </div>
</div>

<div class="wrap">
  <!-- page-title row removed: the mailbox is shown in the rail's switcher and the
       hint is a tooltip on the search row plus the reading pane's empty state. -->
  <div id="inboxHost"><div style="padding:40px;text-align:center;color:var(--text-muted)">Loading inbox…</div></div>
</div>

<!-- DOMPurify (Cure53 v3.4.12, vendored + SRI-pinned) MUST load before inbox.js — the
     composer refuses to open without it rather than risk sending unsanitized HTML. -->
<script src="/admin/js/vendor/purify.min.js?v=3.4.12"
        integrity="sha384-piCcpDdJ7qVeK4Tv8Z6Hpcr3ZBIgP16TxQTPVfsLFdZ5uDgwc3Y8Ho7oUnqf12qu"
        crossorigin="anonymous"></script>
<script src="/admin/js/inbox.js?v=8fd048b1ed"></script>
<script>
(function(){
  var tries=0;
  (function waitClient(){
    if (window._supabaseClient){
      window.GmailInbox.mount({
        el:'#inboxHost',
        client:window._supabaseClient,
        mailboxes:['processing@ratesandrealty.com'],
        showSwitcher:false
      });
      return;
    }
    if (tries++ > 120){ document.getElementById('inboxHost').innerHTML='<div style="padding:40px;text-align:center;color:#e05252">Could not initialize session. Try reloading.</div>'; return; }
    setTimeout(waitClient, 50);
  })();
})();
</script>
</body>
</html>
