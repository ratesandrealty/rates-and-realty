<html lang="en">
<head>
<meta charset="UTF-8">

<script src="/admin/js/supabase-client.js?v=b8721bd6a2"></script>
<script src="/admin/js/auth-guard.js?v=ddcae2d476"></script>

<style>
  :root {
    --gold: #c9a84c;
    --bg: #0d0d0d;
    --surface: #141414;
    --surface2: #1a1a1a;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #fff;
    --text-muted: rgba(255,255,255,0.4);
    --green: #52c87a;
    --red: #e05252;
    --orange: #e07f50;
    --blue: #5aa0e0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

  /* Header */
  .header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; background: var(--surface);
    border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  .header h1 { font-size: 16px; font-weight: 700; flex-shrink: 0; }
  .header-stats { display: flex; gap: 16px; font-size: 12px; color: var(--text-muted); }
  .header-stats span strong { color: var(--gold); }
  .header-right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .header-right .who { font-size: 12px; color: var(--text-muted); }
  .btn-back {
    padding: 6px 12px; background: rgba(255,255,255,0.06);
    border: 1px solid var(--border); border-radius: 7px;
    color: var(--text-muted); font-size: 12px; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
  }
  .btn-gold {
    padding: 6px 14px; background: var(--gold); border: none;
    border-radius: 7px; color: #000; font-size: 12px;
    font-weight: 700; cursor: pointer; white-space: nowrap;
  }

  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 80px; }

  /* Task groups */
  .group { margin-bottom: 26px; }
  .group-header {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 700; letter-spacing: 0.3px;
    text-transform: uppercase; margin-bottom: 10px;
  }
  .group-count {
    font-size: 11px; background: rgba(255,255,255,0.08);
    color: var(--text-muted); padding: 2px 8px; border-radius: 10px;
  }
  .group-overdue  .group-header { color: var(--red); }
  .group-today    .group-header { color: var(--gold); }
  .group-upcoming .group-header { color: var(--blue); }
  .group-no_date  .group-header { color: var(--text-muted); }

  /* Task card */
  .task {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
    display: flex; gap: 14px; align-items: flex-start;
  }
  .task-main { flex: 1; min-width: 0; }
  .task-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .task-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; white-space: pre-wrap; }
  .task-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 11px; }
  .pill {
    font-size: 10px; padding: 2px 8px; border-radius: 8px;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px;
  }
    .pill-human{background:rgba(201,168,76,.14);color:#C9A84C;border:1px solid rgba(201,168,76,.35)}
    .pill-auto{background:rgba(255,255,255,.05);color:#8b8b8b;border:1px solid rgba(255,255,255,.12)}
    .pill-unowned{background:rgba(224,168,82,.12);color:#E0A852;border:1px solid rgba(224,168,82,.35)}
  .prio-urgent { background: rgba(224,82,82,0.15); color: #ff6b6b; }
  .prio-high   { background: rgba(224,127,80,0.15); color: #ffa030; }
  .prio-normal { background: rgba(90,160,224,0.15); color: #7ab6f0; }
  .prio-low    { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.5); }
  .due { color: var(--text-muted); }
  .due.is-overdue { color: #ff6b6b; }
  .task-links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; }
  .task-links a { color: var(--gold); text-decoration: none; }
  .task-links a:hover { text-decoration: underline; }
  .clickup-link { color: var(--blue) !important; }
  .task-actions { flex-shrink: 0; }
  .btn-complete {
    padding: 7px 12px; background: rgba(82,200,122,0.12);
    border: 1px solid rgba(82,200,122,0.3); border-radius: 8px;
    color: var(--green); font-size: 12px; font-weight: 700; cursor: pointer;
    white-space: nowrap;
  }
  .btn-complete:hover { background: rgba(82,200,122,0.2); }
  .btn-complete:disabled { opacity: 0.5; cursor: default; }
  /* Stacked under Complete. Pending is visibly distinct so parked work is
     obvious at a glance; the waiting state is deliberately NOT a button —
     there is nothing for her to press while it is with Rene. */
  .task-actions { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .btn-pending, .btn-question {
    padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 700;
    cursor: pointer; white-space: nowrap; font-family: inherit;
  }
  .btn-pending  { background: rgba(224,127,80,.12); border: 1px solid rgba(224,127,80,.35); color: var(--orange); }
  .btn-pending:hover  { background: rgba(224,127,80,.2); }
  .btn-question { background: rgba(90,160,224,.12); border: 1px solid rgba(90,160,224,.35); color: var(--blue); }
  .btn-question:hover { background: rgba(90,160,224,.2); }
  .btn-waiting {
    padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 700;
    background: rgba(201,168,76,.10); border: 1px dashed rgba(201,168,76,.45);
    color: var(--gold); text-align: center; white-space: nowrap;
  }
  /* Parked and waiting tasks read differently from actionable ones. */
  .task.is-pending  { border-left: 3px solid var(--orange); }
  .task.is-question { border-left: 3px solid var(--gold); }

  /* Empty / loading */
  .empty, .loading { text-align: center; padding: 50px 20px; color: var(--text-muted); font-size: 13px; }
  .empty .emoji { font-size: 34px; display: block; margin-bottom: 12px; }

  /* Assign form */
  .assign-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; margin-bottom: 26px;
  }
  .assign-card h2 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .assign-card .sub { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
  .field { margin-bottom: 12px; position: relative; }
  .field label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
  .field input, .field textarea, .field select {
    width: 100%; padding: 9px 11px; background: var(--surface2);
    border: 1px solid var(--border2); border-radius: 8px;
    color: #fff; font-size: 13px; font-family: inherit; outline: none;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: rgba(201,168,76,0.5); }
  .field textarea { resize: vertical; min-height: 60px; }
  .field-row { display: flex; gap: 12px; }
  .field-row .field { flex: 1; }
  .contact-results {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 20;
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 8px; margin-top: 4px; max-height: 200px; overflow-y: auto;
    display: none;
  }
  .contact-results.show { display: block; }
  .contact-result {
    padding: 8px 11px; font-size: 12px; cursor: pointer; border-bottom: 1px solid var(--border);
  }
  .contact-result:last-child { border-bottom: none; }
  .contact-result:hover { background: rgba(201,168,76,0.08); }
  .contact-result small { color: var(--text-muted); }
  .selected-contact {
    display: none; align-items: center; gap: 8px; margin-top: 6px;
    font-size: 12px; color: var(--green);
  }
  .selected-contact.show { display: flex; }
  .selected-contact button {
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 14px; padding: 0;
  }

  /* Toast */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #222; border: 1px solid var(--border2); border-radius: 10px;
    padding: 10px 20px; font-size: 13px; color: #fff;
    opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 9999;
  }
  #toast.show { opacity: 1; }
  #toast.err { border-color: rgba(224,82,82,0.5); }

  /* Help + language */
  .icon-btn {
    background: rgba(255,255,255,0.06); border: 1px solid var(--border2);
    color: var(--text-muted); border-radius: 6px; width: 26px; height: 26px;
    font-size: 12px; cursor: pointer; line-height: 1; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  .icon-btn:hover { color: var(--gold); border-color: rgba(201,168,76,0.4); }
  .lang-select {
    padding: 6px 8px; background: rgba(255,255,255,0.06);
    border: 1px solid var(--border); border-radius: 7px;
    color: var(--text-muted); font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .intro-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; margin-bottom: 20px;
  }
  .intro-card h2 { font-size: 15px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .intro-body { font-size: 13px; color: rgba(255,255,255,0.75); line-height: 1.6; }
  .video-wrap {
    position: relative; width: 100%; padding-bottom: 56.25%; height: 0;
    margin-top: 14px; border-radius: 10px; overflow: hidden; background: #000;
  }
  .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .video-native-wrap { margin: 14px 0; }
  .video-native-wrap video { width: 100%; max-height: 60vh; border-radius: 10px; background: #000; display: block; }

  /* Help modal (view + edit) */
  .help-overlay {
    position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .help-overlay.show { display: flex; }
  .help-modal {
    width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto;
    background: var(--surface); border: 1px solid rgba(201,168,76,0.3);
    border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,0.6);
  }
  .help-modal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .help-modal-head h3 { font-size: 15px; font-weight: 700; color: var(--gold); }
  .help-modal-body { padding: 16px 18px; font-size: 13px; color: rgba(255,255,255,0.82); line-height: 1.6; }
  .help-modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); }
  .help-modal-actions:empty { display: none; }
  .x-btn { background: transparent; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; line-height: 1; }

  /* Segmented view toggle */
  .seg { display: inline-flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 4px; margin-bottom: 20px; }
  .seg-btn { padding: 7px 16px; background: transparent; border: none; border-radius: 7px; color: var(--text-muted); font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .seg-btn.active { background: var(--gold); color: #000; }

  /* Shared-lead cards (View 2) */
  .lead-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .lead-card-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .lead-name { font-size: 15px; font-weight: 700; }
  .stage-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; padding: 2px 8px; border-radius: 8px; background: rgba(201,168,76,0.15); color: var(--gold); }
  .lead-head-links { margin-left: auto; display: flex; gap: 12px; align-items: center; font-size: 12px; flex-wrap: wrap; }
  .lead-head-links a { color: var(--gold); text-decoration: none; }
  .lead-head-links a:hover { text-decoration: underline; }
  .mine-badge { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; padding: 1px 6px; border-radius: 6px; background: rgba(82,200,122,0.15); color: var(--green); }
  .shared-task { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--border); }
  .shared-task-main { flex: 1; min-width: 0; }
  .shared-task-title { font-size: 13px; color: #eee; }
  .shared-task-meta { display: flex; gap: 8px; align-items: center; margin-top: 3px; flex-wrap: wrap; }
  .no-tasks { font-size: 12px; color: var(--text-muted); padding: 9px 0; border-top: 1px solid var(--border); margin-top: 8px; }
  .note-box { margin-top: 12px; }
  .note-box textarea { width: 100%; padding: 9px 11px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; color: #fff; font-size: 13px; font-family: inherit; outline: none; resize: vertical; min-height: 52px; }
  .note-box textarea:focus { border-color: rgba(201,168,76,0.5); }
  .note-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
  .btn-note { padding: 6px 14px; background: rgba(201,168,76,0.14); border: 1px solid rgba(201,168,76,0.4); color: var(--gold); border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn-note:disabled { opacity: 0.5; cursor: default; }
</style>

<body>

<div class="header">
  <a href="va-dashboard.html" class="btn-back">📊 Dashboard</a>
  <a href="va-tasks.html" class="btn-back" style="border-color:var(--gold);color:var(--gold);">✅ My Tasks</a>
    <a href="va-people.html" class="nav-link">👥 Shared with me</a>
  <a href="va-inbox.html" class="btn-back">📥 Inbox</a>
  <a href="/admin/chat.html" class="btn-back">💬 Chat</a>
  <h1>✅ My Tasks</h1>
  <button class="icon-btn" title="Help: your daily tasks" data-help-topic="va.daily_tasks" data-help-title="Your daily tasks" data-help-self>ℹ️</button>
  <div class="header-stats">
    <span>Open: <strong id="openCount">—</strong></span>
  </div>
  <!-- Visible to her by design: the person being measured sees the same
       number her employer sees. A silent heartbeat buys nothing and reads
       badly if discovered. -->
  <div id="presence-readout"></div>
  <div class="header-right">
    <span style="font-size:14px;" title="Help language">🌐</span>
    <select id="helpLang" class="lang-select" title="Help language" onchange="onHelpLangChange(this.value)">
      <option value="en">English</option>
    </select>
    <button class="icon-btn" title="Welcome & help" data-help-topic="va.welcome" data-help-title="Welcome" data-help-self>ℹ️</button>
    <a id="manageVideosLink" href="/admin/va-help.html" class="btn-back" title="Manage VA help videos" style="display:none;border-color:var(--gold);color:var(--gold);">🎥 Help videos</a>
    <span class="who" id="adminUserEmail"></span>
    <button class="btn-back" onclick="window.adminLogout && window.adminLogout()">Log out</button>
  </div>
</div>

<div class="wrap">

  <!-- Welcome / video intro (va-help 'welcome' block); hidden until loaded -->
  <div id="introCard" style="display:none;"></div>

  <!-- Assign a task to Rene -->
  <div class="assign-card">
    <h2>➕ Assign a task to Rene <button class="icon-btn" title="Help: assigning to Rene" data-help-topic="va.assign_rene" data-help-title="Assign a task to Rene" data-help-self>ℹ️</button></h2>
    <div class="sub">Creates a task in Rene's ClickUp board and a linked CRM task assigned to him.</div>
    <form id="assignForm" onsubmit="return submitAssign(event)">
      <div class="field">
        <label for="af-title">Title <span style="color:var(--red)">*</span></label>
        <input type="text" id="af-title" required placeholder="e.g. Call borrower about missing paystub">
      </div>
      <div class="field">
        <label for="af-desc">Description</label>
        <textarea id="af-desc" placeholder="Optional details / context"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="af-due">Due date</label>
          <input type="date" id="af-due">
        </div>
        <div class="field">
          <label for="af-prio">Priority</label>
          <select id="af-prio">
            <option value="urgent">Urgent</option>
            <option value="high">High</option>
            <option value="normal" selected>Normal</option>
            <option value="low">Low</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="af-contact">Associate a contact (optional)</label>
        <input type="text" id="af-contact" placeholder="Search contacts by name, email, or phone…" autocomplete="off"
               oninput="onContactSearch(this.value)" onblur="setTimeout(hideContactResults, 150)">
        <div class="contact-results" id="contactResults"></div>
        <div class="selected-contact" id="selectedContact">
          <span id="selectedContactLabel"></span>
          <button type="button" title="Clear" onclick="clearSelectedContact()">✕</button>
        </div>
      </div>
      <button type="submit" class="btn-gold" id="assignBtn">Create task for Rene</button>
    </form>
  </div>

  <!-- Task views: My Tasks (assigned to me) / Shared files (assist Rene) -->
  <div class="seg" id="viewSeg">
    <button type="button" class="seg-btn active" id="segMine" onclick="setView('mine')">📋 My Tasks</button>
    <button type="button" class="seg-btn" id="segShared" onclick="setView('shared')">🤝 Shared files</button>
  </div>

  <!-- View 1: tasks assigned directly to the VA (va_daily_tasks) -->
  <div id="taskList">
    <div class="loading">Loading your tasks…</div>
  </div>

  <!-- View 2: leads shared with the VA (va_shared_leads) -->
  <div id="sharedList" style="display:none;">
    <div class="loading">Loading shared files…</div>
  </div>

</div>

<!-- Help view modal -->
<div class="help-overlay" id="helpOverlay" onclick="if(event.target===this)closeHelp()">
  <div class="help-modal">
    <div class="help-modal-head"><h3 id="helpModalTitle">Help</h3><button class="x-btn" title="Close" onclick="closeHelp()">✕</button></div>
    <div class="help-modal-body" id="helpModalBody"></div>
    <div class="help-modal-actions" id="helpModalEdit"></div>

<!-- Help edit modal (admin only) -->
<div class="help-overlay" id="helpEditOverlay" onclick="if(event.target===this)closeHelpEdit()">

      <input type="hidden" id="helpEditKey">

      <div class="field"><label for="helpEditBody">Body — Markdown (**bold**, newlines)</label><textarea id="helpEditBody" style="min-height:150px;"></textarea></div>

      <button class="btn-back" onclick="closeHelpEdit()">Cancel</button>
      <button class="btn-gold" id="helpEditSaveBtn" onclick="saveHelpEdit()">Save</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// Rene (owner) — fixed CRM assignee for tasks the VA hands off.
const RENE_UID = '59e012b0-8a20-4bd1-9b08-b5e10f76eea2';

// Bucket render order + labels; empty buckets are hidden.
const BUCKET_ORDER = [
  { key: 'overdue',  label: '⚠️ Overdue' },
  { key: 'today',    label: '📅 Today' },
  { key: 'upcoming', label: '🔜 Upcoming' },
  { key: 'no_date',  label: '🗓 No due date' },
];

let _supabase = null;      // canonical session-aware client
let _currentUser = null;   // supabase auth user (the logged-in VA/admin)
let _selectedContactId = null;
let _view = localStorage.getItem('rnr_va_view') || 'mine'; // 'mine' | 'shared'

// ── Client + current user ────────────────────────────────────────────────
async function init() {
  try {
    _supabase = await window.getSupabaseClient();
  } catch (e) {
    console.error('[va-tasks] client init failed', e);
    document.getElementById('taskList').innerHTML =
      '<div class="empty">Could not connect. Please refresh.</div>';
    return;
  }

  // Authenticated staff only. auth-guard already redirects if there is no session;
  // getUser() gives us the real uid we need for the assignment audit trail.
  const { data: userData, error: userErr } = await _supabase.auth.getUser();
  if (userErr || !userData || !userData.user) {
    console.error('[va-tasks] getUser failed', userErr);
    window.location.replace('/auth/admin-login.html?redirect=' + encodeURIComponent(location.pathname));
    return;
  }
  _currentUser = userData.user;
  const emailEl = document.getElementById('adminUserEmail');
  if (emailEl && _currentUser.email) emailEl.textContent = _currentUser.email;

  setView(_view);   // remembers last-selected view; loads My Tasks or Shared files
  initHelp();
}

// ── View switching (segmented toggle) ────────────────────────────────────
function setView(view) {
  _view = (view === 'shared') ? 'shared' : 'mine';
  localStorage.setItem('rnr_va_view', _view);
  const mineOn = _view === 'mine';
  document.getElementById('segMine').classList.toggle('active', mineOn);
  document.getElementById('segShared').classList.toggle('active', !mineOn);
  document.getElementById('taskList').style.display = mineOn ? '' : 'none';
  document.getElementById('sharedList').style.display = mineOn ? 'none' : '';
  if (mineOn) loadTasks(); else loadShared();
}

// ── READ: the VA's task list via RPC ─────────────────────────────────────
async function loadTasks() {
  const listEl = document.getElementById('taskList');
  const { data, error } = await _supabase.rpc('va_daily_tasks');

  if (error) {
    console.error('[va-tasks] va_daily_tasks failed', error);
    listEl.innerHTML = '<div class="empty">Could not load tasks. Please refresh.</div>';
    return;
  }

  const tasks = Array.isArray(data) ? data : [];
  document.getElementById('openCount').textContent = tasks.length;

  if (tasks.length === 0) {
    listEl.innerHTML =
      '<div class="empty"><span class="emoji">🎉</span>No tasks assigned to you.</div>';
    return;
  }

  // Group by bucket (RPC already ordered by due_date within the result set).
  const groups = {};
  BUCKET_ORDER.forEach(function (b) { groups[b.key] = []; });
  tasks.forEach(function (t) {
    const b = t.bucket && groups[t.bucket] ? t.bucket : 'no_date';
    groups[b].push(t);
  });

  listEl.innerHTML = BUCKET_ORDER.map(function (b) {
    const rows = groups[b.key];
    if (!rows.length) return ''; // hide empty groups
    return '<div class="group group-' + b.key + '">' +
      '<div class="group-header">' + b.label +
        ' <span class="group-count">' + rows.length + '</span></div>' +
      rows.map(renderTask).join('') +
    '</div>';
  }).join('');
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function prioClass(p) {
  const t = (p || 'normal').toLowerCase();
  if (t === 'urgent') return 'prio-urgent';
  if (t === 'high') return 'prio-high';
  if (t === 'low') return 'prio-low';
  return 'prio-normal';
}

function fmtDue(dateStr, bucket) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return esc(dateStr);
  const label = d.toLocaleDateString('en-US', { timeZone: 'America/Los_Angeles', month: 'short', day: 'numeric', year: 'numeric' });
  const cls = bucket === 'overdue' ? 'due is-overdue' : 'due';
  return '<span class="' + cls + '">📅 ' + label + '</span>';
}

function renderTask(t) {
  const prio = (t.priority || 'normal');
  let links = '';
  if (t.contact_name && t.contact_id) {
    links += '<a href="lead-detail?contact_id=' + encodeURIComponent(t.contact_id) + '">👤 ' +
      esc(t.contact_name) + '</a>';
  } else if (t.contact_name) {
    links += '<span style="color:var(--text-muted)">👤 ' + esc(t.contact_name) + '</span>';
  }
  if (t.contact_phone) {
    const tel = String(t.contact_phone).replace(/[^0-9+]/g, '');
    links += '<a href="tel:' + esc(tel) + '">📞 ' + esc(t.contact_phone) + '</a>';
  }
  if (t.clickup_url) {
    links += '<a class="clickup-link" href="' + esc(t.clickup_url) + '" target="_blank" rel="noopener">🔗 ClickUp</a>';
  }
  /* An order reminder is only actionable next to the order it names, and the
     lead page opens on a different tab. Deep-link to the card:
     #processing is restored by _ldRestoreTabFromHash(), &order=<id> resolved by
     lpFocusOrderFromHash(). Processing is admin-only, so a VA following this
     gets a toast rather than a silent landing on the default tab. */
  if (t.related_table === 'loan_orders' && t.related_id && t.contact_id) {
    links += '<a href="lead-detail?contact_id=' + encodeURIComponent(t.contact_id)
          + '#processing&order=' + encodeURIComponent(t.related_id) + '">🧾 Open order</a>';
  }

  const stateCls = t.question_pending ? ' is-question' : (t.status === 'pending' ? ' is-pending' : '');
  return '<div class="task' + stateCls + '" data-id="' + esc(t.id) + '">' +
    '<div class="task-main">' +
      '<div class="task-title">' + esc(t.title || 'Untitled task') + '</div>' +
      (t.description ? '<div class="task-desc">' + esc(t.description) + '</div>' : '') +
      '<div class="task-meta">' +
        '<span class="pill ' + prioClass(prio) + '">' + esc(prio) + '</span>' +
        fmtDue(t.due_date, t.bucket) +
        /* Provenance, because "Rene asked me" and "the system noticed a stale
           lead" are different instructions. When this shipped, 46 of the 48 open
           unassigned tasks were machine-made — without the label the two real
           ones are invisible in the noise. */
        (t.provenance === 'human'
          ? '<span class="pill pill-human" title="Added by Rene">from Rene</span>'
          : '<span class="pill pill-auto" title="Created automatically by the system">automatic</span>') +
        (t.assignee_state === 'unassigned'
          ? '<span class="pill pill-unowned" title="Nobody owns this yet">unassigned</span>'
          : '') +
      '</div>' +
      (links ? '<div class="task-links">' + links + '</div>' : '') +
    '</div>' +
    '<div class="task-actions">' +
      '<button class="btn-complete" onclick="completeTask(this, \'' + esc(t.id) + '\')">✓ Complete</button>' +
      /* Pending and Question stack under Complete. status is CONSTRAINED to
         open|pending|question|completed|cancelled, so a typo here fails loudly
         instead of inventing a sixth state. */
      (t.question_pending
        ? '<div class="btn-waiting" title="Asked — waiting on an answer">⏳ with Rene</div>'
        : '<button class="btn-pending" onclick="setTaskStatus(this, \'' + esc(t.id) + '\', \'' + (t.status === 'pending' ? 'open' : 'pending') + '\')">'
            + (t.status === 'pending' ? '↩ Un-park' : '⏳ Pending') + '</button>'
          + '<button class="btn-question" onclick="askQuestion(\'' + esc(t.id) + '\')">❓ Have a question</button>') +
    '</div>' +
  '</div>';
}

/* ── Status + question ──────────────────────────────────────────────────────
   Both go through RPCs that stamp the actor, so a status change and a note are
   attributable to the account the same way completed_by already is. */
async function setTaskStatus(btn, taskId, status) {
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  /* task_set_status, not va_task_set_status — the one write path. It validates
     the status against the five legal values and authorises PER TASK (admin, or
     assignee, or the lead is shared with you) rather than on role alone, and it
     drives the _task_clickup_sync seam.

     Activity logging was the one thing va_task_set_status did that this did
     not, so it was added to task_set_status first; consolidating onto a write
     path that quietly drops history would not be a consolidation. Verified:
     open→pending and pending→open log status_changed, →completed logs
     completed, and a repeated pending→pending logs nothing.

     The no-reopen rule is NOT in either function — it lives in the table
     trigger fn_tasks_block_reopen, so it applies to every write path equally
     and this swap cannot change it. This page can only send 'pending' or
     'open' anyway, and completed tasks never appear on it. */
  const { error } = await _supabase.rpc('task_set_status', { p_id: taskId, p_status: status });
  if (error) {
    console.error('[va-tasks] status change failed', error);
    showToast('⚠ Could not update task', true);
    if (btn) btn.disabled = false;
    loadTasks();
    return;
  }
  showToast(status === 'pending' ? 'Parked' : 'Back in your list');
  loadTasks();
}

async function askQuestion(taskId) {
  const body = window.prompt('What do you need to know? Rene will be notified and this task will show as waiting.');
  if (body === null) return;                       // cancelled, not an empty question
  if (!body.trim()) { showToast('⚠ Question cannot be empty', true); return; }
  const { error } = await _supabase.rpc('task_note_add', { p_task_id: taskId, p_body: body.trim(), p_kind: 'question' });
  if (error) {
    console.error('[va-tasks] question failed', error);
    showToast('⚠ Could not send question', true);
    return;
  }
  /* Say the notification landed, not just that the note saved. task_note_add
     used to call app_notify_mentions, which notifies only @handles — so a
     question reached nobody while reporting success. */
  showToast('Sent — Rene has been notified');
  loadTasks();
}

// ── ACTION: complete a task ──────────────────────────────────────────────
async function completeTask(btn, taskId) {
  if (btn) { btn.disabled = true; btn.textContent = 'Completing…'; }

  /* task_set_status, not a direct table update. The direct write skipped the
     status validation, the per-task authorisation check and the
     _task_clickup_sync seam, and RLS was the only thing deciding whether it was
     allowed. Completion stamping was never the gap here - the
     trg_tasks_stamp_completion trigger already sets completed_at/_source on any
     update path - and this now also writes a task_activity row, which the
     direct update never did. */
  const { error } = await _supabase
    .rpc('task_set_status', { p_id: taskId, p_status: 'completed' });

  if (error) {
    console.error('[va-tasks] complete failed', error);
    showToast('⚠ Could not complete task', true);
    if (btn) { btn.disabled = false; btn.textContent = '✓ Complete'; }
    return;
  }

  // Remove the card immediately; re-fetch to keep counts/groups accurate.
  const card = btn && btn.closest('.task');
  if (card) card.remove();
  showToast('✓ Task completed');
  loadTasks();
}

// VIEW 2: SHARED FILES (leads shared with the VA — assist Rene)
// ════════════════════════════════════════════════════════════════════════
async function loadShared() {
  const el = document.getElementById('sharedList');
  const { data, error } = await _supabase.rpc('va_shared_leads');

  if (error) {
    console.error('[va-tasks] va_shared_leads failed', error);
    el.innerHTML = '<div class="empty">Could not load shared files. Please refresh.</div>';
    return;
  }

  const leads = Array.isArray(data) ? data : [];
  if (!leads.length) {
    el.innerHTML = '<div class="empty"><span class="emoji">🤝</span>No files shared with you yet.</div>';
    return;
  }
  el.innerHTML = leads.map(renderLeadCard).join('');
  // Loan-health status pill per shared lead so the VA sees what's urgent/missing (read-only).
  leads.forEach(function (l) { vaLoadHealth(String(l.contact_id || '')); });
}

function vaHealthPill(h) {
  var st = (h && h.status) || 'on_track';
  var m = st === 'behind'  ? { t:'🔴 Behind',  c:'#ff9598', bg:'rgba(229,72,77,.14)',  bd:'rgba(229,72,77,.4)' }
        : st === 'at_risk' ? { t:'⚠ At Risk', c:'#e8c07a', bg:'rgba(224,168,82,.14)', bd:'rgba(224,168,82,.4)' }
        :                    { t:'✓ On Track', c:'#7bd39a', bg:'rgba(39,174,96,.14)',  bd:'rgba(39,174,96,.4)' };
  return '<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:' + m.bg + ';border:1px solid ' + m.bd + ';color:' + m.c + ';white-space:nowrap;">' + m.t + '</span>';
}
async function vaLoadHealth(cid) {
  if (!cid) return;
  var slot = document.getElementById('vahealth-' + cid); if (!slot) return;
  try {
    const { data, error } = await _supabase.rpc('loan_health', { p_contact_id: cid });
    if (error || !data) return;
    var oc = data.overdue_count || 0, cp = (data.conditions || {}).pending || 0;
    var bits = []; if (oc) bits.push(oc + ' overdue'); if (cp) bits.push(cp + ' cond.');
    slot.innerHTML = vaHealthPill(data) + (bits.length ? '<span style="font-size:10px;color:var(--text-muted);margin-left:6px;">' + esc(bits.join(' · ')) + '</span>' : '');
  } catch (e) { /* non-fatal */ }
}

function renderLeadCard(l) {
  const cid = String(l.contact_id || '');
  const name = esc(l.name || 'Unknown');
  const stage = l.pipeline_status ? '<span class="stage-badge">' + esc(l.pipeline_status) + '</span>' : '';
  let headLinks = '';
  if (l.phone) {
    const tel = String(l.phone).replace(/[^0-9+]/g, '');
    headLinks += '<a href="tel:' + esc(tel) + '">📞 ' + esc(l.phone) + '</a>';
  }
  headLinks += '<a href="lead-detail?contact_id=' + encodeURIComponent(cid) + '">Open lead ›</a>';

  const tasks = Array.isArray(l.tasks) ? l.tasks : [];
  let tasksHtml;
  if (!tasks.length) {
    tasksHtml = '<div class="no-tasks">No open tasks — add a note to help Rene.</div>';
  } else {
    tasksHtml = tasks.map(function (t) {
      const prio = (t.priority || 'normal');
      const mine = t.mine === true ? ' <span class="mine-badge">assigned to me</span>' : '';
      return '<div class="shared-task">' +
        '<div class="shared-task-main">' +
          '<div class="shared-task-title">' + esc(t.title || 'Untitled task') + '</div>' +
          '<div class="shared-task-meta">' +
            '<span class="pill ' + prioClass(prio) + '">' + esc(prio) + '</span>' +
            fmtDue(t.due_date, '') + mine +
          '</div>' +
        '</div>' +
        '<button class="btn-complete" onclick="completeSharedTask(this, \'' + esc(String(t.id)) + '\')">✓ Complete</button>' +
      '</div>';
    }).join('');
  }

  const noteBox = '<div class="note-box">' +
    '<textarea id="note-' + esc(cid) + '" placeholder="Add a note to help Rene…"></textarea>' +
    '<div class="note-actions"><button class="btn-note" onclick="saveNote(\'' + esc(cid) + '\', this)">Save note</button></div>' +
  '</div>';

  return '<div class="lead-card" data-cid="' + esc(cid) + '">' +
    '<div class="lead-card-head">' +
      '<span class="lead-name">' + name + '</span>' + stage +
      '<span id="vahealth-' + esc(cid) + '" style="margin-left:2px;"></span>' +
      '<span class="lead-head-links">' + headLinks + '</span>' +
    '</div>' +
    tasksHtml +
    noteBox +
  '</div>';
}

// Complete a task from a shared-lead card; re-fetch the shared view afterward.
async function completeSharedTask(btn, taskId) {
  if (btn) { btn.disabled = true; btn.textContent = 'Completing…'; }

  /* task_set_status, not a direct table update. The direct write skipped the
     status validation, the per-task authorisation check and the
     _task_clickup_sync seam, and RLS was the only thing deciding whether it was
     allowed. Completion stamping was never the gap here - the
     trg_tasks_stamp_completion trigger already sets completed_at/_source on any
     update path - and this now also writes a task_activity row, which the
     direct update never did. */
  const { error } = await _supabase
    .rpc('task_set_status', { p_id: taskId, p_status: 'completed' });

  if (error) {
    console.error('[va-tasks] complete (shared) failed', error);
    showToast('⚠ Could not complete task', true);
    if (btn) { btn.disabled = false; btn.textContent = '✓ Complete'; }
    return;
  }
  showToast('✓ Task completed');
  loadShared();
}

// Add a note to a shared lead. The RPC only permits notes on leads shared with
// the caller — surface any error message it returns.
async function saveNote(cid, btn) {
  const ta = document.getElementById('note-' + cid);
  const text = (ta && ta.value || '').trim();
  if (!text) { if (ta) ta.focus(); return; }

  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  try {
    const { error } = await _supabase.rpc('add_contact_note', { p_contact_id: cid, p_note: text });
    if (error) throw error;
    showToast('Note added');
    if (ta) ta.value = '';
  } catch (e) {
    console.error('[va-tasks] add_contact_note failed', e);
    showToast('⚠ ' + (e.message || 'Could not add note'), true);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Save note'; }
  }
}

// ── Contact association search (optional) ────────────────────────────────
let _searchTimer = null;
function onContactSearch(q) {
  _selectedContactId = null; // typing invalidates any prior selection
  document.getElementById('selectedContact').classList.remove('show');
  clearTimeout(_searchTimer);
  const term = (q || '').trim();
  if (term.length < 2) { hideContactResults(); return; }
  _searchTimer = setTimeout(function () { runContactSearch(term); }, 220);
}

async function runContactSearch(term) {
  const box = document.getElementById('contactResults');
  try {
    const like = '%' + term + '%';
    const { data, error } = await _supabase
      .from('contacts_secure')
      .select('id, first_name, last_name, email, phone')
      .or('first_name.ilike.' + like + ',last_name.ilike.' + like + ',email.ilike.' + like + ',phone.ilike.' + like)
      .limit(8);
    if (error) throw error;
    const rows = data || [];
    if (!rows.length) {
      box.innerHTML = '<div class="contact-result"><small>No matches</small></div>';
      box.classList.add('show');
      return;
    }
    box.innerHTML = rows.map(function (c) {
      const name = [c.first_name, c.last_name].filter(Boolean).join(' ') || (c.email || 'Unknown');
      const sub = [c.email, c.phone].filter(Boolean).join(' · ');
      return '<div class="contact-result" onmousedown="pickContact(\'' + esc(c.id) + '\',\'' +
        esc(name).replace(/'/g, '&#39;') + '\')">' + esc(name) +
        (sub ? ' <small>' + esc(sub) + '</small>' : '') + '</div>';
    }).join('');
    box.classList.add('show');
  } catch (e) {
    console.error('[va-tasks] contact search failed', e);
    hideContactResults();
  }
}

function pickContact(id, name) {
  _selectedContactId = id;
  document.getElementById('af-contact').value = '';
  document.getElementById('selectedContactLabel').textContent = '👤 ' + name;
  document.getElementById('selectedContact').classList.add('show');
  hideContactResults();
}

function clearSelectedContact() {
  _selectedContactId = null;
  document.getElementById('selectedContact').classList.remove('show');
}

function hideContactResults() {
  document.getElementById('contactResults').classList.remove('show');
}

// ── ACTION: assign a task to Rene via clickup-bridge edge function ───────
async function submitAssign(ev) {
  ev.preventDefault();
  const btn = document.getElementById('assignBtn');
  const title = document.getElementById('af-title').value.trim();
  if (!title) { showToast('Title is required', true); return false; }
  if (!_currentUser || !_currentUser.id) { showToast('Not signed in', true); return false; }

  const description = document.getElementById('af-desc').value.trim();
  /* 17:00 UTC via RRTime.dateToUtc — see the note in rr-time.js. */
  const due_date = window.RRTime.dateToUtc(document.getElementById('af-due').value);
  const priority = document.getElementById('af-prio').value || 'normal';

  const body = {
    title: title,
    description: description || null,
    due_date: due_date,
    priority: priority,
    assigned_to: RENE_UID,               // Rene (owner) — fixed CRM assignee
    assigned_by: _currentUser.id,        // real uid of the logged-in VA (audit trail)
  };
  if (_selectedContactId) body.contact_id = _selectedContactId; // omit when none

  const base = (window.APP_CONFIG && window.APP_CONFIG.SUPABASE_URL) || 'https://ljywhvbmsibwnssxpesh.supabase.co';
  const key = (window.APP_CONFIG && window.APP_CONFIG.SUPABASE_ANON_KEY) || '';

  btn.disabled = true;
  const prevLabel = btn.textContent;
  btn.textContent = 'Creating…';

  try {
    const res = await fetch(base + '/functions/v1/clickup-bridge/task', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': key,
        'Authorization': 'Bearer ' + key,
      },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(function () { return {}; });
    if (!res.ok || data.error || data.success === false) {
      throw new Error(data.error || ('ClickUp task failed (HTTP ' + res.status + ')'));
    }

    showToast('✓ Task created for Rene' + (data.clickup_task_id ? ' (ClickUp #' + data.clickup_task_id + ')' : ''));
    document.getElementById('assignForm').reset();
    clearSelectedContact();
  } catch (e) {
    console.error('[va-tasks] assign failed', e);
    showToast('⚠ ' + (e.message || 'Could not create task'), true);
  } finally {
    btn.disabled = false;
    btn.textContent = prevLabel;
  }
  return false;
}

let _helpLang = localStorage.getItem('rnr_help_lang') || 'en';
let _helpBlocks = {};       // key → { key, title, body, video_url }
let _helpLangs = [];        // [{ code, name }]
let _helpOpenKey = null;    // key of the currently open help view modal (for lang re-render)
let _helpAdmin = false;     // true once rnr_app_role resolves to 'admin'

// Fixed display order used as sort_order when saving a block.
const HELP_ORDER = { welcome: 0, daily_tasks: 1, assign_rene: 2, shared_leads: 3 };

// POST to va-help sending the anon key (apikey) + the user's session JWT (Bearer),
// so the function can enforce admin-only on 'save'. Same base/fetch shape the page
// uses for clickup-bridge, but with the real session token instead of anon.
async function callVaHelp(body) {
  const base = (window.APP_CONFIG && window.APP_CONFIG.SUPABASE_URL) || 'https://ljywhvbmsibwnssxpesh.supabase.co';
  const anon = (window.APP_CONFIG && window.APP_CONFIG.SUPABASE_ANON_KEY) || '';
  let token = anon;
  try {
    const { data } = await _supabase.auth.getSession();
    if (data && data.session && data.session.access_token) token = data.session.access_token;
  } catch (e) { /* fall back to anon */ }
  const res = await fetch(base + '/functions/v1/va-help', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': anon, 'Authorization': 'Bearer ' + token },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(function () { return {}; });
  if (!res.ok || data.error) {
    const err = new Error(data.error || ('va-help failed (HTTP ' + res.status + ')'));
    err.status = res.status;
    throw err;
  }
  return data;
}

// Light Markdown: escape HTML first, then **bold** and newlines. Nothing else.
function mdToHtml(md) {
  let h = esc(md || '');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\r\n|\r|\n/g, '<br>');
  return h;
}

// Convert Loom/YouTube share links to embeddable form; otherwise return as-is.
function toEmbedUrl(url) {
  const u = String(url || '').trim();
  if (!u) return '';
  let m;
  if ((m = u.match(/loom\.com\/share\/([A-Za-z0-9]+)/))) return 'https://www.loom.com/embed/' + m[1];
  if ((m = u.match(/youtube\.com\/watch\?v=([A-Za-z0-9_-]+)/))) return 'https://www.youtube.com/embed/' + m[1];
  if ((m = u.match(/youtu\.be\/([A-Za-z0-9_-]+)/))) return 'https://www.youtube.com/embed/' + m[1];
  return u; // already an embed URL or some other host — use as-is
}

// Direct media file (e.g. a recorded webm/mp4 uploaded to the public video-messages
// bucket) → render an inline <video controls>. Loom/YouTube (and other embed hosts)
// stay as iframes. Detect by file extension or the Supabase public-object path.
function isDirectVideo(url) {
  const u = String(url || '').toLowerCase();
  return /\.(webm|mp4|mov|m4v|ogg|ogv)(\?|#|$)/.test(u) || u.indexOf('/storage/v1/object/public/') > -1;
}

function videoHtml(url) {
  const raw = String(url || '').trim();
  if (!raw) return '';
  if (isDirectVideo(raw)) {
    return '<div class="video-native-wrap"><video controls preload="metadata" playsinline src="' +
      esc(raw) + '"></video></div>';
  }
  const embed = toEmbedUrl(raw);
  if (!embed) return '';
  return '<div class="video-wrap"><iframe src="' + esc(embed) +
    '" allowfullscreen allow="fullscreen; picture-in-picture"></iframe></div>';
}

async function initHelp() {
  const sel = document.getElementById('helpLang');
  if (sel) sel.value = _helpLang;         // reflect saved choice immediately
  pollHelpAdmin();                        // reveal admin edit controls once role resolves
  await loadHelpLanguages();
  await loadHelpBlocks();
}

async function loadHelpLanguages() {
  const sel = document.getElementById('helpLang');
  try {
    const data = await callVaHelp({ action: 'languages' });
    _helpLangs = (data && data.languages) || [];
    if (sel && _helpLangs.length) {
      const codes = _helpLangs.map(function (l) { return l.code; });
      if (codes.indexOf(_helpLang) === -1) _helpLang = codes.indexOf('en') > -1 ? 'en' : codes[0];
      sel.innerHTML = _helpLangs.map(function (l) {
        return '<option value="' + esc(l.code) + '">' + esc(l.name) + '</option>';
      }).join('');
      sel.value = _helpLang;
    }
  } catch (e) { console.error('[va-help] languages failed', e); }
}

async function loadHelpBlocks() {
  try {
    const data = await callVaHelp({ action: 'list', lang: _helpLang });
    _helpBlocks = {};
    ((data && data.blocks) || []).forEach(function (b) { if (b && b.key) _helpBlocks[b.key] = b; });
    renderWelcomeCard();
    if (_helpOpenKey) renderHelpModal(_helpOpenKey); // refresh an open panel in the new language
  } catch (e) { console.error('[va-help] list failed', e); }
}

function onHelpLangChange(v) {
  _helpLang = v || 'en';
  localStorage.setItem('rnr_help_lang', _helpLang);
  loadHelpBlocks();
}

// Poll until auth-guard publishes the role (same idiom the other pages use);
// only a resolved 'admin' turns on the edit affordances.
function pollHelpAdmin(attempt) {
  attempt = attempt || 0;
  const role = (sessionStorage.getItem('rnr_app_role') || '').toLowerCase();
  if (role) {
    _helpAdmin = (role === 'admin');
    const mv = document.getElementById('manageVideosLink');
    if (mv) mv.style.display = _helpAdmin ? 'inline-flex' : 'none';
    renderWelcomeCard();
    if (_helpOpenKey) renderHelpModal(_helpOpenKey);
    return;
  }
  if (attempt >= 40) return; // ~6s ceiling
  setTimeout(function () { pollHelpAdmin(attempt + 1); }, 150);
}

function renderWelcomeCard() {
  const el = document.getElementById('introCard');
  if (!el) return;
  const b = _helpBlocks['welcome'];
  if (!b) { el.style.display = 'none'; return; }
  const editBtn = _helpAdmin
    ? '<button class="icon-btn" title="Edit welcome" onclick="openHelpEdit(\'welcome\')">✏️</button>' : '';
  const sharedLink = _helpBlocks['shared_leads']
    ? '<div style="margin-top:12px;"><a href="#" onclick="if(window.HelpTopic)HelpTopic.open(\'va.shared_leads\',\'How shared leads work\');return false;" style="color:var(--gold);font-size:12px;text-decoration:none;">ℹ️ How shared leads work</a></div>' : '';
  el.style.display = 'block';
  el.innerHTML =
    '<div class="intro-card">' +
      '<h2>' + esc(b.title || 'Welcome') + '<span style="flex:1"></span>' + editBtn + '</h2>' +
      '<div class="intro-body">' + mdToHtml(b.body) + '</div>' +
      videoHtml(b.video_url) +
      sharedLink +
    '</div>';
}

async function openHelp(key) {
  _helpOpenKey = key;
  if (!_helpBlocks[key]) { await loadHelpBlocks(); }
  renderHelpModal(key);
  document.getElementById('helpOverlay').classList.add('show');
}

function renderHelpModal(key) {
  const b = _helpBlocks[key];
  const titleEl = document.getElementById('helpModalTitle');
  const bodyEl = document.getElementById('helpModalBody');
  const editWrap = document.getElementById('helpModalEdit');
  if (!b) {
    titleEl.textContent = 'Help';
    bodyEl.innerHTML = '<div style="color:var(--text-muted)">Not available yet in this language.</div>';
  } else {
    titleEl.textContent = b.title || 'Help';
    // How-to video ABOVE the help text so the VA sees it first.
    bodyEl.innerHTML = videoHtml(b.video_url) + '<div>' + mdToHtml(b.body) + '</div>';
  }
  editWrap.innerHTML = _helpAdmin
    ? '<button class="btn-gold" onclick="openHelpEdit(\'' + esc(key) + '\')">✏️ Edit</button>' : '';
}

function closeHelp() {
  _helpOpenKey = null;
  document.getElementById('helpOverlay').classList.remove('show');
}

// ── Admin edit-in-place ──────────────────────────────────────────────────
function openHelpEdit(key) {
  if (!_helpAdmin) return; // hard gate — VAs never reach this
  const b = _helpBlocks[key] || { key: key };
  document.getElementById('helpEditKey').value = key;
  document.getElementById('helpEditTitle').value = b.title || '';
  document.getElementById('helpEditBody').value = b.body || '';
  document.getElementById('helpEditVideo').value = b.video_url || '';
  document.getElementById('helpEditHead').textContent = 'Edit help — ' + key + ' (' + _helpLang + ')';
  document.getElementById('helpEditOverlay').classList.add('show');
}

function closeHelpEdit() {
  document.getElementById('helpEditOverlay').classList.remove('show');
}

async function saveHelpEdit() {
  if (!_helpAdmin) return;
  const key = document.getElementById('helpEditKey').value;
  const title = document.getElementById('helpEditTitle').value.trim();
  const bodyv = document.getElementById('helpEditBody').value;
  const video = document.getElementById('helpEditVideo').value.trim();
  const btn = document.getElementById('helpEditSaveBtn');
  const prev = btn.textContent;
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const data = await callVaHelp({
      action: 'save',
      key: key,
      title: title,
      body: bodyv,
      video_url: video || null,
      sort_order: (HELP_ORDER[key] != null ? HELP_ORDER[key] : 0),
      lang: _helpLang,            // target the language currently being viewed/edited
    });
    if (!data || data.success !== true) throw new Error((data && data.error) || 'Save failed');
    showToast('Saved');
    closeHelpEdit();
    await loadHelpBlocks();       // re-fetch so the new text/video shows immediately
  } catch (e) {
    console.error('[va-help] save failed', e);
    showToast('⚠ ' + (e.message || 'Save failed'), true);
  } finally {
    btn.disabled = false; btn.textContent = prev;
  }
}

// ── Toast ────────────────────────────────────────────────────────────────
function showToast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  setTimeout(function () { t.classList.remove('show'); }, 2800);
}

init();
</script>
</body>
</html>
