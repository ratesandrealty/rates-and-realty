[functions.activity-tracker]
# Pinned at the value that is LIVE right now, not a change. false because the
# page calls it from the browser and it is fire-and-forget telemetry; the
# session token it now receives is used for ATTRIBUTION only (stamping
# created_by) and is never required — a call without one still writes.
#
# Because the token now arrives, adding a real in-function guard later is
# trivial: the identity is already resolved. That is deliberately NOT done here.
verify_jwt = false

[functions.google-drive-upload]
# Pinned at the value that is LIVE right now, not a change. true, but that is a
# STABILITY control and not an access one: the gateway only checks the bearer is
# a project-signed JWT, and the anon key is one, printed in every page's source.
# So this is another member of the docs/PINNED-NOT-GUARDED.md class.
#
# The session token the caller now sends is used for ATTRIBUTION only (stamping
# uploaded_documents.uploaded_by) and is never required — a call carrying only
# the anon key still uploads, exactly as before. Because the identity is now
# resolved in-function, a real guard here is a small change; deliberately not
# made in this pass.
verify_jwt = true

# ─────────────────────────────────────────────────────────────────────────────
# docs/PINNED-NOT-GUARDED.md — the remaining members of that class.
#
# All of these are LIVE at verify_jwt = true and were UNPINNED, which is its own
# bug in both directions: nothing held them at true, and tools/deploy-function.sh
# refuses to ship an unpinned slug, so none of them could be deployed through the
# wrapper at all. Pinned here at the value production already has. This is not a
# change to any of them.
#
# It is also NOT a guard. The gateway only checks that the bearer is a
# project-signed JWT, and the anon key is one, printed in every page's source.
# Every function below still has NO in-function auth. The guards land after each
# one's callers are switched to the session token and confirmed working — the
# order is in CLAUDE.md and was learned by breaking email-service with it
# reversed.
