<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Staff Chat — Rates &amp; Realty CRM</title>
<link rel="icon" href="/assets/images/favicon.png">
<script src="/api/env.js?v=2026033003"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/admin/js/supabase-client.js?v=b8721bd6a2"></script>
<script src="/admin/js/attachment-viewer.js?v=e8f2b14c9f"></script>
<script src="/admin/js/auth-guard.js?v=7e1ff38f96"></script>
<style>
  :root { --gold:#c9a84c; --bg:#0a0a0a; --surface:#141414; --border:rgba(255,255,255,0.07); --text:#fff; --muted:rgba(255,255,255,0.4); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; display:flex; flex-direction:column; min-height:100vh; }
  .header {
    display:flex; align-items:center; gap:12px; padding:12px 20px; background:var(--surface);
    border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .header h1 { font-size:16px; font-weight:700; }
  .header .spacer { flex:1; }
  .btn-back {
    padding:6px 12px; background:rgba(255,255,255,0.06); border:1px solid var(--border);
    border-radius:7px; color:var(--muted); font-size:12px; cursor:pointer; text-decoration:none;
    display:inline-flex; align-items:center; gap:5px;
  }
  .btn-back:hover { color:#fff; }
  .who { font-size:12px; color:var(--muted); }
  /* Full-page chat fills the remaining height; staff-chat.js renders into #staff-chat-fullpage */
  .chat-shell { flex:1; min-height:0; margin:16px; border:1px solid var(--border); border-radius:14px; overflow:hidden; background:var(--surface); }
  #staff-chat-fullpage { height:100%; }
  .loading { padding:40px; text-align:center; color:var(--muted); font-size:13px; }
  @media (max-width:720px){ .chat-shell { margin:0; border:none; border-radius:0; } }
</style>
</head>
<body>

<div class="header">
  <a href="/dashboard/admin.html" class="btn-back">← Dashboard</a>
  <a href="/admin/people.html" class="btn-back">People</a>
  <h1>💬 Staff Chat</h1>
  <div class="spacer"></div>
  <span class="who" id="adminUserEmail"></span>
  <button class="btn-back" onclick="window.adminLogout && window.adminLogout()">Log out</button>
</div>

<div class="chat-shell">
  <div id="staff-chat-fullpage"><div class="loading">Loading chat…</div></div>
</div>

<!-- Renders the two-pane chat into #staff-chat-fullpage (full mode); no floating bubble here. -->
<!-- Shared recorder. staff-chat.js delegates its Record button to this;
     without it the button reports that it is unavailable rather than failing silently. -->
<script src="/admin/js/loom-recorder.js"></script>
<script src="/admin/js/staff-chat.js?v=2a8cfafc29"></script>
<script>
  // Fill the signed-in staff email once auth-guard publishes the session.
  (function fillEmail(attempt){
    attempt = attempt || 0;
    try {
      var u = window._adminUser;
      if (u && u.email) { var el = document.getElementById('adminUserEmail'); if (el) el.textContent = u.email; return; }
    } catch (e) {}
    if (attempt < 40) setTimeout(function(){ fillEmail(attempt + 1); }, 150);
  })();
</script>
</body>
</html>
