<!DOCTYPE html>
<!--
  OAuth confirmation, served from OUR origin rather than the edge function.

  google-calendar-auth used to render this page itself. It set
  'Content-Type: text/html; charset=utf-8' correctly and it still arrived in the
  browser as text/plain with 'Content-Security-Policy: default-src none; sandbox'
  attached, so Rene saw raw markup instead of a page. That rewrite is Supabase's
  anti-phishing control on *.supabase.co/functions/v1/* — HTML from a functions
  origin is deliberately neutered, while application/json from the same gateway
  passes through untouched. No header the function sets can win that argument.

  So the function now 302s here and this page renders on admin.ratesandrealty.com,
  where the Worker serves HTML as HTML. Self-contained on purpose: no ?v= pinned
  assets, so it can never be the file someone forgets to restamp.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Google Connected — Rates &amp; Realty</title>
  <style>
    :root { color-scheme: dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111; color: #fff; margin: 0;
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .card {
      text-align: center; padding: 40px; background: #1a1a1a;
      border: 1px solid rgba(201,168,76,0.3); border-radius: 16px;
      max-width: 520px; margin: 20px;
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h2 { margin: 0 0 8px; }
    .ok h2 { color: #c9a84c; }
    .bad h2 { color: #ff6b6b; }
    p { color: rgba(255,255,255,0.6); line-height: 1.5; }
    .scopes {
      margin: 20px 0 0; padding: 12px 16px; background: rgba(255,255,255,0.04);
      border-radius: 8px; font-size: 13px; color: rgba(255,255,255,0.55);
      text-align: left;
    }
    .scopes code { color: #c9a84c; }
    a.btn {
      display: inline-block; margin-top: 24px; padding: 12px 24px;
      background: #c9a84c; color: #111; border-radius: 8px;
      text-decoration: none; font-weight: 700;
    }
    .detail { font-size: 13px; color: rgba(255,255,255,0.45); word-break: break-word; }
  </style>
</head>
<body>
  <div class="card ok" id="card">
    <div class="icon" id="icon">&#x2705;</div>
    <h2 id="title">Google Connected</h2>
    <p id="msg">Calendar, Drive and Gmail access granted for rene@ratesandrealty.com.</p>
    <div class="scopes" id="scopes">
      Drive is authorised with the full <code>drive</code> scope, which is what lets
      the document mirror write into borrower folders created by the n8n workflow.
      <code>drive.file</code> would not.
    </div>
    <p class="detail" id="detail"></p>
    <!-- people.html, not contacts.html: the old page linked to a file that has
         never existed in this repo, so the button 404'd into the marketing site. -->
    <a class="btn" href="/admin/people.html">Back to CRM &#x2192;</a>
  </div>

  <script>
    // The function passes ?error= on the failure path. Everything rendered here
    // is inserted with textContent, never innerHTML — the value arrives from a
    // redirect and is attacker-influencable in principle.
    (function () {
      var err = new URLSearchParams(location.search).get('error');
      if (!err) return;
      document.getElementById('card').className = 'card bad';
      document.getElementById('icon').textContent = '❌';
      document.getElementById('title').textContent = 'Google Connection Failed';
      document.getElementById('msg').textContent =
        'The consent flow did not complete, so nothing was saved. Drive, Calendar and Gmail are still using the previous credential.';
      document.getElementById('scopes').remove();
      document.getElementById('detail').textContent = 'Google reported: ' + err;
    })();
  </script>
</body>
</html>
