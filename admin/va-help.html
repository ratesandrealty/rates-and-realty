<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Help Video Manager — Rates & Realty CRM</title>
<script src="/api/env.js?v=2026033003"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/admin/js/supabase-client.js?v=2026050601"></script>
<script src="/admin/js/auth-guard.js?v=2026070605"></script>
<script src="/admin/js/loom-recorder.js?v=2026070601"></script>
<style>
  :root { --gold:#c9a84c; --bg:#0d0d0d; --surface:#141414; --surface2:#1a1a1a; --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.12); --text:#fff; --muted:rgba(255,255,255,.4); --green:#52c87a; --red:#e05252; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; min-height:100vh; }
  .header { display:flex; align-items:center; gap:12px; padding:12px 20px; background:var(--surface); border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .header h1 { font-size:16px; font-weight:700; flex-shrink:0; }
  .header-right { margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .who { font-size:12px; color:var(--muted); }
  .btn-back { padding:6px 12px; background:rgba(255,255,255,.06); border:1px solid var(--border); border-radius:7px; color:var(--muted); font-size:12px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:4px; }
  .btn-gold { padding:7px 14px; background:var(--gold); border:none; border-radius:8px; color:#111; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap; }
  .wrap { max-width:820px; margin:0 auto; padding:22px 16px 90px; }
  .intro { font-size:13px; color:rgba(255,255,255,.7); line-height:1.6; margin-bottom:20px; }
  .intro strong { color:var(--gold); }
  .loading, .empty, .denied { text-align:center; padding:50px 20px; color:var(--muted); font-size:13px; }
  .denied .emoji, .empty .emoji { font-size:34px; display:block; margin-bottom:12px; }
  .group-h { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--gold); margin:22px 0 10px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px; }
  .card-head { display:flex; align-items:flex-start; gap:10px; margin-bottom:10px; }
  .card-key { font-size:10px; color:var(--muted); font-family:ui-monospace,monospace; text-transform:uppercase; letter-spacing:.4px; margin-top:4px; }
  .area-badge { margin-left:auto; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--gold); background:rgba(201,168,76,.12); border:1px solid rgba(201,168,76,.3); border-radius:8px; padding:2px 8px; flex-shrink:0; }
  .card video { width:100%; max-height:44vh; border-radius:10px; background:#000; display:block; margin-bottom:10px; }
  .no-video { font-size:12px; color:var(--muted); background:var(--surface2); border:1px dashed var(--border2); border-radius:10px; padding:20px 14px; text-align:center; margin-bottom:6px; }
  .vid-block { margin-bottom:12px; }
  .vid-block video { margin-bottom:6px; }
  .vid-controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .vid-lbl { font-size:11px; color:var(--muted); font-weight:600; }
  .fld-label { font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:600; display:block; margin:8px 0 4px; }
  .inp, .ta, .sel { width:100%; box-sizing:border-box; background:rgba(255,255,255,.05); border:1px solid var(--border2); border-radius:8px; color:#eee; font-size:13px; padding:9px 11px; outline:none; font-family:inherit; }
  .inp:focus, .ta:focus, .sel:focus { border-color:rgba(201,168,76,.5); }
  .ta { min-height:70px; resize:vertical; line-height:1.5; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; align-items:center; }
  .btn { padding:8px 13px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; border:1px solid rgba(201,168,76,.4); background:rgba(201,168,76,.14); color:var(--gold); }
  .btn:hover { background:rgba(201,168,76,.22); }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.solid { background:var(--gold); border-color:var(--gold); color:#111; }
  .btn.danger { background:rgba(224,82,82,.12); border-color:rgba(224,82,82,.4); color:#ff7b7b; }
  .status { font-size:11px; margin-left:auto; }
  .status.ok { color:var(--green); } .status.err { color:var(--red); } .status.busy { color:var(--gold); }
  .spin { display:inline-block; width:12px; height:12px; border:2px solid rgba(201,168,76,.3); border-top-color:var(--gold); border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .toast { position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(10px); z-index:120; background:#1a1a1a; border:1px solid rgba(201,168,76,.4); color:#fff; font-size:12.5px; padding:9px 14px; border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.5); opacity:0; transition:opacity .25s,transform .25s; max-width:90vw; text-align:center; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.err { border-color:rgba(224,82,82,.5); }
</style>
  <link rel="stylesheet" href="/public/css/responsive-global.css">
</head>
<body>

<div class="header">
  <a href="/dashboard/admin" class="btn-back">← Dashboard</a>
  <h1>🎥 Help Video Manager</h1>
  <div class="header-right">
    <button class="btn-gold" id="newTopicBtn">＋ New topic</button>
    <span class="who" id="adminUserEmail"></span>
    <button class="btn-back" onclick="window.adminLogout && window.adminLogout()">Log out</button>
  </div>
</div>

<div class="wrap">
  <div class="intro">
    Record or upload a short <strong>how-to explainer</strong> and description for each help topic. These power
    the <strong>ⓘ</strong> info buttons across the VA portal and CRM. Topics are keyed like
    <strong>va.daily_tasks</strong> or <strong>crm.lead.pricing</strong>.
  </div>
  <div id="groups"><div class="loading"><span class="spin"></span> Loading topics…</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
var BUCKET = 'video-messages';
var _sb = null, _topics = [], _busy = {};

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function cssq(s){ return String(s).replace(/["\\]/g,'\\$&'); }
function toast(msg,isErr){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.toggle('err',!!isErr); t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},3000); }

async function init(){
  try { _sb = await window.getSupabaseClient(); }
  catch(e){ document.getElementById('groups').innerHTML='<div class="empty">Could not connect. Please refresh.</div>'; return; }
  try { var u=await _sb.auth.getUser(); if(u&&u.data&&u.data.user&&u.data.user.email) document.getElementById('adminUserEmail').textContent=u.data.user.email; } catch(e){}
  document.getElementById('newTopicBtn').addEventListener('click', newTopic);
  gateAdmin();
}
function gateAdmin(attempt){
  attempt=attempt||0;
  var role=(sessionStorage.getItem('rnr_app_role')||'').toLowerCase();
  if(role){
    if(role!=='admin'){ document.getElementById('groups').innerHTML='<div class="denied"><span class="emoji">🔒</span>Admins only.</div>'; document.getElementById('newTopicBtn').style.display='none'; return; }
    loadTopics(); return;
  }
  if(attempt>=40){ loadTopics(); return; }
  setTimeout(function(){ gateAdmin(attempt+1); },150);
}

async function loadTopics(){
  try {
    var r=await _sb.rpc('help_topics_list');
    if(r.error) throw r.error;
    _topics=(r.data||[]).slice().sort(function(a,b){ return String(a.topic_key).localeCompare(String(b.topic_key)); });
    render();
  } catch(e){
    console.error('[help-mgr] list', e);
    document.getElementById('groups').innerHTML='<div class="empty">Could not load topics.'+(e&&e.message?'<br><span style="font-size:11px;">'+esc(e.message)+'</span>':'')+'</div>';
  }
}

function groupLabel(area){ return area==='va'?'VA Portal':area==='crm'?'CRM':'Shared (VA + CRM)'; }

function render(){
  var host=document.getElementById('groups');
  if(!_topics.length){ host.innerHTML='<div class="empty">No help topics yet. Tap “＋ New topic”.</div>'; return; }
  var order=['va','crm','both'], html='';
  order.forEach(function(area){
    var list=_topics.filter(function(t){ return (t.area||'both')===area; });
    if(!list.length) return;
    html+='<div class="group-h">'+esc(groupLabel(area))+'</div>'+list.map(cardHtml).join('');
  });
  // any unexpected area value
  var known=_topics.filter(function(t){ return order.indexOf(t.area||'both')>=0; }).length;
  if(known<_topics.length){ html+='<div class="group-h">Other</div>'+_topics.filter(function(t){return order.indexOf(t.area||'both')<0;}).map(cardHtml).join(''); }
  host.innerHTML=html;
}

// The video block: player + Replace(Record/Upload)/Delete when a video exists, else Record/Upload.
function videoBlockHtml(t){
  if(t.video_url){
    return '<video controls preload="metadata" playsinline src="'+esc(t.video_url)+'"></video>'
      + '<div class="vid-controls"><span class="vid-lbl">Replace:</span>'
      +   '<button class="btn" data-act="record">🎥 Record</button>'
      +   '<button class="btn" data-act="upload">⬆️ Upload</button>'
      +   '<button class="btn danger" data-act="delete">🗑 Delete video</button>'
      + '</div>';
  }
  return '<div class="no-video">No explainer video yet.</div>'
    + '<div class="vid-controls">'
    +   '<button class="btn" data-act="record">🎥 Record</button>'
    +   '<button class="btn" data-act="upload">⬆️ Upload</button>'
    + '</div>';
}
function cardHtml(t){
  var k=t.topic_key;
  var areas=['va','crm','both'].map(function(a){ return '<option value="'+a+'"'+((t.area||'both')===a?' selected':'')+'>'+a.toUpperCase()+'</option>'; }).join('');
  return '<div class="card" data-card="'+esc(k)+'">'
    + '<div class="card-head"><div><div style="font-size:14px;font-weight:700;color:#fff;">'+esc(t.title||k)+'</div><div class="card-key">'+esc(k)+'</div></div>'
    +   '<span class="area-badge">'+esc((t.area||'both'))+'</span></div>'
    + '<div class="vid-block" data-vidblock>'+videoBlockHtml(t)+'</div>'
    + '<label class="fld-label">Title</label><input class="inp" data-f="title" value="'+esc(t.title||'')+'" placeholder="Topic title">'
    + '<label class="fld-label">Description</label><textarea class="ta" data-f="description" placeholder="What does this topic explain?">'+esc(t.description||'')+'</textarea>'
    + '<label class="fld-label">Area</label><select class="sel" data-f="area" style="max-width:200px;">'+areas+'</select>'
    + '<input type="file" accept="video/*" data-file style="display:none">'
    + '<div class="actions">'
    +   '<button class="btn solid" data-act="save">💾 Save</button>'
    +   '<span class="status" data-status></span>'
    + '</div></div>';
}

function cardEl(k){ return document.querySelector('[data-card="'+cssq(k)+'"]'); }
function setStatus(k,msg,cls){ var c=cardEl(k); if(!c) return; var s=c.querySelector('[data-status]'); if(s){ s.className='status'+(cls?' '+cls:''); s.innerHTML=msg||''; } }
function setBusy(k,b){ _busy[k]=b; var c=cardEl(k); if(c) Array.prototype.forEach.call(c.querySelectorAll('.btn'),function(btn){ btn.disabled=b; }); }
function readCard(k){ var c=cardEl(k); if(!c) return null; return { title:c.querySelector('[data-f="title"]').value, description:c.querySelector('[data-f="description"]').value, area:c.querySelector('[data-f="area"]').value }; }

async function upsert(k, fields){
  var r=await _sb.rpc('help_topic_upsert', {
    p_key:k, p_title:fields.title||'', p_description:fields.description||'',
    p_video_url:fields.video_url||'', p_video_slug:fields.video_slug||'', p_area:fields.area||'both'
  });
  if(r.error) throw r.error;
  // reflect locally
  var i=_topics.findIndex(function(t){ return t.topic_key===k; });
  var row={ topic_key:k, title:fields.title||'', description:fields.description||'', video_url:fields.video_url||'', video_slug:fields.video_slug||'', area:fields.area||'both' };
  if(i>=0) _topics[i]=row; else _topics.push(row);
  return row;
}

function currentVideo(k){ var t=_topics.find(function(x){return x.topic_key===k;})||{}; return { video_url:t.video_url||'', video_slug:t.video_slug||'' }; }

async function saveCard(k){
  if(_busy[k]) return;
  var f=readCard(k); if(!f) return;
  var v=currentVideo(k); f.video_url=v.video_url; f.video_slug=v.video_slug;
  setBusy(k,true); setStatus(k,'<span class="spin"></span> Saving…','busy');
  try { await upsert(k,f); setBusy(k,false); setStatus(k,'✓ Saved','ok'); toast('Saved'); setTimeout(function(){setStatus(k,'');},2000); }
  catch(e){ setBusy(k,false); setStatus(k,'⚠ '+((e&&e.message)||'Failed'),'err'); toast('Save failed',true); }
}

// Video-only save/replace/delete: passes NULL for title/description/area so those are KEPT
// (help_topic_upsert treats null as "no change"); '' video_url CLEARS the video (delete) but
// keeps the topic row + text. Targeted refresh preserves any unsaved input edits.
async function setVideoOnly(k, video_url, video_slug){
  setBusy(k,true); setStatus(k,'<span class="spin"></span> Saving…','busy');
  try {
    var r=await _sb.rpc('help_topic_upsert', { p_key:k, p_title:null, p_description:null, p_video_url:video_url, p_video_slug:video_slug||null, p_area:null });
    if(r.error) throw r.error;
    var t=_topics.find(function(x){return x.topic_key===k;}); if(t){ t.video_url=video_url; t.video_slug=video_slug||''; }
    setBusy(k,false); refreshCardVideo(k);
    setStatus(k,'✓ '+(video_url?'Saved':'Deleted'),'ok'); toast(video_url?'Video saved':'Video deleted'); setTimeout(function(){ setStatus(k,''); },2000);
  } catch(e){ setBusy(k,false); setStatus(k,'⚠ '+((e&&e.message)||'Failed'),'err'); toast('Save failed',true); }
}
// Re-render ONLY the card's video block (keeps unsaved title/description edits in the inputs).
function refreshCardVideo(k){
  var c=cardEl(k); if(!c) return; var vb=c.querySelector('[data-vidblock]'); var t=_topics.find(function(x){return x.topic_key===k;}); if(vb&&t) vb.innerHTML=videoBlockHtml(t);
}
async function deleteVideoFor(k){
  if(_busy[k]) return;
  if(!confirm('Remove this help video?')) return;
  var t=_topics.find(function(x){return x.topic_key===k;}); var oldUrl=t?t.video_url:'';
  await setVideoOnly(k, '', null);                                   // help_topic_upsert(k,null,null,'',null,null) — clears video, keeps topic + text
  var p=bucketPath(oldUrl); if(p){ try{ await _sb.storage.from(BUCKET).remove([p]); }catch(_){} }   // best-effort, non-fatal
}
function bucketPath(url){ var u=String(url||''), marker='/storage/v1/object/public/'+BUCKET+'/', i=u.indexOf(marker); if(i===-1) return null; return decodeURIComponent(u.slice(i+marker.length).split('?')[0]); }

async function uploadFor(k, file){
  if(file.size>100*1024*1024){ toast('File is over 100 MB',true); return; }
  setBusy(k,true); setStatus(k,'<span class="spin"></span> Uploading…','busy');
  try {
    var ext=((file.name||'').match(/\.([a-z0-9]{2,5})$/i)||[])[1]||'webm';
    var safe=String(k).replace(/[^a-z0-9._-]/gi,'_');
    var path='help/'+safe+'-'+crypto.randomUUID()+'.'+ext.toLowerCase();
    var up=await _sb.storage.from(BUCKET).upload(path,file,{contentType:file.type||'video/webm',upsert:false});
    if(up.error) throw up.error;
    var pub=_sb.storage.from(BUCKET).getPublicUrl(path);
    setBusy(k,false);
    await setVideoOnly(k, (pub&&pub.data&&pub.data.publicUrl)||'', '');
  } catch(e){ setBusy(k,false); setStatus(k,'⚠ '+((e&&e.message)||'Upload failed'),'err'); toast('Upload failed',true); }
}

async function newTopic(){
  var key=(prompt('New topic key (e.g. crm.lead.pricing or va.daily_tasks):','')||'').trim();
  if(!key) return;
  if(!/^[a-z0-9]+(\.[a-z0-9_]+)+$/i.test(key)){ if(!confirm('“'+key+'” doesn’t look like a dotted key (e.g. crm.lead.pricing). Create it anyway?')) return; }
  if(_topics.some(function(t){return t.topic_key===key;})){ toast('That key already exists',true); return; }
  var area=(prompt('Area — va, crm, or both:','both')||'both').trim().toLowerCase();
  if(['va','crm','both'].indexOf(area)<0) area='both';
  try { await upsert(key,{title:'',description:'',video_url:'',video_slug:'',area:area}); render(); toast('Topic created'); var c=cardEl(key); if(c) c.scrollIntoView({behavior:'smooth',block:'center'}); }
  catch(e){ toast('Could not create topic: '+((e&&e.message)||'error'),true); }
}

// Delegated card actions
document.addEventListener('click', function(e){
  var btn=e.target.closest('.btn[data-act]'); if(!btn) return;
  var card=btn.closest('[data-card]'); if(!card) return;
  var k=card.getAttribute('data-card'); var act=btn.getAttribute('data-act');
  if(_busy[k]) return;
  if(act==='save') saveCard(k);
  else if(act==='delete') deleteVideoFor(k);
  else if(act==='upload') card.querySelector('[data-file]').click();
  else if(act==='record'){
    if(!window.LoomRecorder){ toast('Recorder not loaded — refresh',true); return; }
    window.LoomRecorder.open({ context:'help', onSaved:function(v){ setVideoOnly(k, v.public_url, v.slug||''); } });
  }
});
document.addEventListener('change', function(e){
  if(e.target && e.target.hasAttribute && e.target.hasAttribute('data-file')){
    var card=e.target.closest('[data-card]'); var f=e.target.files&&e.target.files[0]; e.target.value='';
    if(card && f) uploadFor(card.getAttribute('data-card'), f);
  }
});

init();
</script>
</body>
</html>
