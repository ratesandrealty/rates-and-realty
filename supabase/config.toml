# Supabase project config.
# Edge functions that serve external webhooks must NOT require a Supabase JWT,
# or the gateway 401s the (unauthenticated) inbound request before it reaches the
# function. `supabase functions deploy` defaults verify_jwt back to true unless the
# function is pinned here.

[functions.sms-assistant]
# Twilio posts the staff-line (888) SMS/MMS webhook here with no auth header.
verify_jwt = false

# Called every minute by cron (jobid 39) with Content-Type only and NO
# Authorization header, so it must not verify a JWT. It was deployed unpinned at
# 2026-07-31 07:30:09, which flipped it to verify_jwt=true, and every run since
# returned UNAUTHORIZED_NO_AUTH_HEADER. Nothing alerted; it was found by reading
# net._http_response.
[functions.send-scheduled-sms]
verify_jwt = false

# Same shape: cron jobid 3 posts Content-Type only, no Authorization. Currently
# false on the deployed copy but it was never pinned, so the next deploy of it
# would break scheduled email exactly the same way.
[functions.send-scheduled-emails]
verify_jwt = false

# Twilio posts here with no auth header either — SMS for +18668919394 and
# +17149092526. NOT pinning these is how a routine `supabase functions deploy`
# silently flipped them to verify_jwt=true and 401'd every real inbound message
# until the next deploy. Authentication for these endpoints is the
# X-Twilio-Signature check in _shared/twilio-signature.ts, not a JWT.
[functions.twilio-inbound]
verify_jwt = false

# Voice webhooks + recordingStatusCallback + play_voicemail TwiML, all from
# Twilio. The browser-facing JSON actions on this same function are a separate
# concern and are not signature-checked.
[functions.twilio-voice]
verify_jwt = false

[functions.portal-data]
# The borrower portal (unified-portal.html) calls this with NO Supabase JWT — it must
# stay verify_jwt=false or the portal 401s and every borrower-facing surface breaks.
verify_jwt = false

[functions.lender-portal]
# public/lender-form.html is used by OUTSIDE lenders who have no Supabase session at
# all — lenders.form_token is the credential. Requiring a JWT 401s every lender link.
verify_jwt = false

[functions.lender-upload]
# Same surface as lender-portal: the outside lender has no session, so the mint /
# finalize / list actions each validate lenders.form_token themselves instead.
verify_jwt = false

[functions.video-track]
# Engagement events from the PUBLIC /v/<slug> page. Viewers are anonymous
# borrowers, so a JWT requirement would 401 every real view. Called only by the
# Worker, which supplies the viewer IP/UA under x-viewer-* headers.
verify_jwt = false

[functions.video-chat]
# Public AI assistant on the video page. Unauthenticated by necessity; the
# spend guard is the per-IP / per-token / per-session rate limit inside it.
verify_jwt = false

[functions.gmail-inbox]
# CRM inbox backend. MUST require a Supabase JWT — the function resolves the caller's
# role from it and hard-gates which Gmail mailbox (rene@ vs processing@) they may touch.
verify_jwt = true

[functions.compose-ai]
# Composer AI assistant. MUST require a Supabase JWT — it reads borrower loan data and
# Gmail thread contents, and gates both on the role resolved from that JWT. Note this
# is deliberately UNLIKE sms-draft-assist (verify_jwt=false, no role guard) — do not
# "make it consistent" by relaxing this.
verify_jwt = true

[functions.gdrive-sync]
# Pinned at its CURRENT value to stop a deploy silently flipping it, not because
# false is the right answer. pg_cron job 36 already sends an anon Bearer, so this
# could be tightened to true — that is a change worth making deliberately and
# testing against the cron, not smuggling in alongside a bug fix.
verify_jwt = false

[functions.sms-service]
# MUST require a Supabase JWT. This function has NO caller authentication of its
# own — it reads to_phone and a message from the body and sends. With
# verify_jwt=false it is an open SMS relay on the business line: anyone who
# guesses the URL can text any number at Rene's expense and from his brand.
# Pinned because it was flipped to false on 2026-08-03 by a routine
# `supabase functions deploy --no-verify-jwt`, exactly the failure this file
# already documents for four other functions. Every legitimate caller
# (gdrive-health-monitor, the CRM UI, cron) sends a service-role or user JWT.
verify_jwt = true

[functions.calendar-data]
# TRUE, which is its current deployed value — pinned here, not changed. Every
# caller holds a JWT: dashboard/utils/calendar.js sends the signed-in user's
# session token on all three of its call sites, and crm-copilot forwards its
# caller's header. There is no public entry point; nothing in public/ or areas/
# references it and it emits no share links or tokens (tour share links come from
# tour-public-view).
#
# The gateway check is DEFENCE IN DEPTH, not the control. It accepts any
# project-signed JWT, including the public anon key printed in
# dashboard/admin.html — and this function returns contact names, phones and
# emails alongside every event. The control is requireStaff() inside the
# function: a real session whose auth_user_roles.role is admin, agent or loa, or
# the service key for crm-copilot. That role set matches crm-copilot's own, so an
# agent or loa cannot be admitted to Copilot and then refused its calendar
# lookups. Verified after deploy: unauthenticated 401, anon-key-only 401.
verify_jwt = true

[functions.gdrive-health-monitor]
# Pinned at its CURRENT value, false. cron jobid 6 sends an anon bearer so it
# works either way today; pinned so a redeploy cannot flip it and silence the
# monitor, which is the one thing that would go unnoticed by construction.
verify_jwt = false

[functions.google-calendar-sync]
# Pinned at its CURRENT value, false — not a change, and not an endorsement. It
# has no in-function auth check, so it belongs on the open-surface list with
# people-admin and the rest. Pinned now because the pagination/sendUpdates change
# needed deploying and the wrapper refuses an unpinned slug, which is the rule
# working. Callers: calendar-data, tour-public-view and tours-admin all send the
# service key; dashboard/utils/calendar.js sends the user's session token. So a
# guard here would not break any caller — it is simply not written yet.
verify_jwt = false

[functions.clickup-bridge]
# MUST be false. Both callers reach it with NO Authorization header by design —
# pg_cron jobid 15 (clickup-bridge-sync, */15) and sms-assistant's
# create_clickup_task / list_my_tasks_today, whose own header comment records
# that a stray bearer used to 401 at the gateway. The bridge authenticates to
# ClickUp itself with the RAW CLICKUP_API_TOKEN.
#
# It was deployed UNPINNED on 2026-07-31 10:17, took the CLI default of true, and
# every caller has been 401'd at the gateway ever since — the cron sync stopped
# refreshing clickup_task_cache and Rene's SMS task creation returned "auth error
# (401)". Nothing alerted. Fourth instance of this exact failure, after
# send-scheduled-sms, send-scheduled-emails and sms-service.
verify_jwt = false

[functions.lead-scorer]
# Pinned at its CURRENT value, which is already false. Not a change — cron jobs 12
# and 18 send a service-role bearer, so it works either way today. Pinned because
# it was the next one to break for free: unpinned, the next deploy takes the CLI
# default of true, and trigger_score_recalc() fires through pg_net, which is
# fire-and-forget, so lead scoring would have gone silent with nothing to notice.
verify_jwt = false

[functions.email-service]
# false is now CORRECT, not a compromise — same shape as esign. One action
# (ai_compose) is called by public/unified-portal.html, which is served to
# borrowers, so a blanket JWT requirement would 401 the borrower assistant. The
# control is inside the function: requireAdmin() on every action except
# ai_compose, applied to the RESOLVED action so the alias table cannot walk a
# gated action past it. ai_compose cannot send; it returns generated text, and
# its spend guard is the compose:* rate limit in video_chat_limits.
#
# Unlike communications-admin, which went to true because every one of its
# callers holds a session, this one keeps a genuinely public entry point.
verify_jwt = false

[functions.communications-admin]
# Now TRUE. The in-function requireAdmin() guard landed alongside this, and the
# CRM sends the signed-in user's session token on all three paths — load, send
# and search were each confirmed by hand against a real session before this flip.
#
# Pinned true rather than deleted. The previous comment said to remove the block;
# that turns out to be wrong twice over. tools/deploy-function.sh refuses an
# unpinned slug, and an unpinned function takes the CLI default — which is how
# send-scheduled-sms silently became verify_jwt=true and returned
# UNAUTHORIZED_NO_AUTH_HEADER on every cron run for days. A value this file does
# not state is a value nobody decided.
#
# The gateway check is defence in depth, not the control. It accepts ANY
# project-signed JWT including the public anon key, so requireAdmin() inside the
# function is what actually distinguishes an admin from a stranger.
verify_jwt = true

[functions.esign]
# The borrower signing page (sign.html) posts action=view / action=submit with an
# apikey header and NO Authorization header at all, so a JWT requirement 401s
# every signing link at the gateway. Authentication is inside the function:
