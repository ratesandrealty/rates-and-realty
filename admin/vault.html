<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Vault — Rates &amp; Realty CRM</title>
<link rel="icon" href="/assets/images/favicon.png">
<script src="/api/env.js?v=2026033003"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root { --gold:#c9a84c; --bg:#0a0a0a; --surface:#141414; --surface2:#1a1a1a; --border:rgba(255,255,255,0.08); --text:#fff; --muted:rgba(255,255,255,0.45); --red:#e0524f; --green:#52c87a; --blue:#5aa0e0; --purple:#ab7fe0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; display:flex; flex-direction:column; min-height:100vh; }
  a { color:inherit; }
  .header { display:flex; align-items:center; gap:12px; padding:12px 20px; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; flex-wrap:wrap; }
  .header h1 { font-size:16px; font-weight:700; }
  .header .spacer { flex:1; }
  .who { font-size:12px; color:var(--muted); }
  .btn-back { padding:6px 12px; background:rgba(255,255,255,0.06); border:1px solid var(--border); border-radius:7px; color:var(--muted); font-size:12px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:5px; }
  .btn-back:hover { color:#fff; }

  .shell { flex:1; min-height:0; display:grid; grid-template-columns:248px 1fr; }
  /* Sidebar */
  .side { border-right:1px solid var(--border); background:var(--surface); overflow-y:auto; padding:14px 10px; }
  .side-label { font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); font-weight:700; padding:12px 10px 6px; }
  .side-item { display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:8px; cursor:pointer; font-size:13px; color:#ddd; }
  .side-item:hover { background:rgba(255,255,255,0.04); }
  .side-item.active { background:rgba(201,168,76,0.14); color:var(--gold); }
  .side-item .si-name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .side-item .si-count { font-size:11px; color:var(--muted); background:rgba(255,255,255,0.06); border-radius:9px; padding:1px 7px; }
  .si-dot { width:10px; height:10px; border-radius:3px; flex-shrink:0; }
  .si-ico { width:16px; text-align:center; flex-shrink:0; }
  .folder-row { position:relative; }
  .folder-row .fr-tools { display:none; gap:2px; }
  .folder-row:hover .fr-tools { display:flex; }
  .folder-row:hover .si-count { display:none; }
  .fr-btn { background:transparent; border:none; color:var(--muted); cursor:pointer; font-size:12px; padding:2px 4px; border-radius:5px; }
  .fr-btn:hover { color:#fff; background:rgba(255,255,255,0.08); }
  .newfolder { display:flex; align-items:center; gap:8px; padding:9px 10px; margin-top:4px; border:1px dashed rgba(201,168,76,0.35); border-radius:8px; color:var(--gold); font-size:12.5px; font-weight:600; cursor:pointer; background:transparent; width:100%; font-family:inherit; }
  .newfolder:hover { background:rgba(201,168,76,0.08); }

  /* Main */
  .main { min-width:0; display:flex; flex-direction:column; min-height:0; }
  .toolbar { display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--border); flex-wrap:wrap; flex-shrink:0; }
  .toolbar .title { font-size:15px; font-weight:700; }
  .search { flex:1; min-width:160px; max-width:320px; background:var(--surface); border:1px solid var(--border); border-radius:9px; color:#fff; font-size:13px; padding:8px 12px; outline:none; }
  .segbar { display:inline-flex; background:var(--surface); border:1px solid var(--border); border-radius:9px; overflow:hidden; }
  .seg { background:transparent; border:none; color:var(--muted); font-size:12px; font-weight:600; padding:7px 12px; cursor:pointer; font-family:inherit; }
  .seg.active { background:var(--gold); color:#111; }
  .selg { background:var(--surface); border:1px solid var(--border); border-radius:9px; color:#ddd; font-size:12px; padding:7px 10px; outline:none; font-family:inherit; }
  .count { font-size:12px; color:var(--muted); margin-left:auto; }
  .scroller { flex:1; min-height:0; overflow-y:auto; padding:16px 18px 60px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; }
  .v-group { margin-bottom:22px; }
  .v-group-h { font-size:12px; font-weight:700; color:var(--gold); text-transform:uppercase; letter-spacing:.5px; margin:0 2px 10px; display:flex; align-items:center; gap:8px; }
  .v-group-h .gc { font-size:11px; color:var(--muted); font-weight:500; }

  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
  .thumb { aspect-ratio:16/10; background:var(--surface2); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; cursor:pointer; }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .thumb .ic { font-size:38px; opacity:.5; }
  .thumb .play { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .thumb .play span { width:42px; height:42px; border-radius:50%; background:rgba(0,0,0,.55); border:1px solid rgba(201,168,76,.5); color:var(--gold); display:flex; align-items:center; justify-content:center; font-size:17px; }
  .thumb.has-thumb { background:#0d0d0d; }
  .thumb.shimmer::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.07) 50%, rgba(255,255,255,0) 100%); background-size:200% 100%; animation:vshimmer 1.1s ease-in-out infinite; pointer-events:none; }
  @keyframes vshimmer { 0%{ background-position:200% 0; } 100%{ background-position:-200% 0; } }
  .src-tag { position:absolute; top:6px; left:6px; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; padding:2px 6px; border-radius:6px; color:#111; }
  .src-chat { background:#7bbacb; } .src-esign { background:var(--gold); } .src-borrower { background:var(--green); }
  .body { padding:9px 11px; flex:1; min-width:0; }
  .kindtag { display:inline-block; font-size:9px; text-transform:uppercase; letter-spacing:.4px; font-weight:700; color:var(--gold); background:rgba(201,168,76,.14); border-radius:6px; padding:1px 6px; margin-bottom:5px; }
  .fname { font-size:13px; font-weight:600; color:#eee; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fsub { font-size:11px; color:var(--muted); margin-top:4px; line-height:1.5; }
  .flead { color:#bda56a; }
  .folder-pills { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
  .fpill { font-size:9px; padding:1px 6px; border-radius:8px; color:#111; font-weight:700; }
  .actions { display:flex; border-top:1px solid var(--border); }
  .act { flex:1; background:transparent; border:none; color:#cfcfcf; font-size:11.5px; font-weight:600; padding:8px 4px; cursor:pointer; font-family:inherit; border-right:1px solid var(--border); white-space:nowrap; }
  .act:last-child { border-right:none; }
  .act:hover { background:rgba(255,255,255,.05); color:#fff; }
  .act.del:hover { background:rgba(224,82,79,.14); color:#ff9a9a; }
  .act.fold:hover { color:var(--gold); }
  .empty, .err { color:var(--muted); font-size:14px; padding:56px 10px; text-align:center; }
  .err { color:var(--red); }

  /* popovers / modal */
  .pop { position:fixed; z-index:200; background:#0d0d0d; border:1px solid rgba(201,168,76,.3); border-radius:10px; box-shadow:0 14px 40px rgba(0,0,0,.6); min-width:200px; max-height:300px; overflow-y:auto; padding:6px; }
  .pop-item { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:7px; cursor:pointer; font-size:12.5px; color:#ddd; }
  .pop-item:hover { background:rgba(255,255,255,.06); }
  .pop-check { width:15px; text-align:center; color:var(--gold); }
  .pop-new { border-top:1px solid var(--border); margin-top:4px; color:var(--gold); font-weight:600; }
  .modal-ov { position:fixed; inset:0; z-index:250; background:rgba(0,0,0,.66); display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal { width:min(380px,94vw); background:#131315; border:1px solid rgba(201,168,76,.3); border-radius:14px; overflow:hidden; }
  .modal-h { padding:14px 18px; border-bottom:1px solid var(--border); font-size:15px; font-weight:700; color:var(--gold); }
  .modal-b { padding:16px 18px; }
  .modal-b label { display:block; font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin-bottom:6px; }
  .modal-b input { width:100%; background:#1a1a1d; border:1px solid rgba(201,168,76,.2); border-radius:8px; color:#eee; font-size:14px; padding:9px 11px; outline:none; }
  .swatches { display:flex; gap:8px; margin-top:12px; }
  .swatch { width:26px; height:26px; border-radius:7px; cursor:pointer; border:2px solid transparent; }
  .swatch.sel { border-color:#fff; }
  .modal-f { display:flex; justify-content:flex-end; gap:8px; padding:12px 18px; border-top:1px solid var(--border); }
  .btn { padding:8px 16px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid var(--border); background:transparent; color:#ccc; font-family:inherit; }
  .btn.gold { background:var(--gold); color:#111; border-color:var(--gold); }

  /* per-borrower sidebar sub-items */
  .side-item.sub { padding-left:24px; font-size:12.5px; }
  .side-item.sub .si-name { color:#cfc9bd; }
  .si-warn { color:#e0a020; font-size:11px; flex-shrink:0; }
  /* borrower view header + type groups */
  .borrower-hdr { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:2px 2px 14px; margin-bottom:6px; border-bottom:1px solid var(--border); }
  .bh-name { font-size:16px; font-weight:700; }
  .bh-tools { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-left:auto; }
  .btn-drive { font-size:12px; font-weight:600; color:var(--gold); background:rgba(201,168,76,.12); border:1px solid rgba(201,168,76,.4); border-radius:8px; padding:6px 12px; text-decoration:none; }
  .btn-drive:hover { background:rgba(201,168,76,.2); }
  .sync-badge { font-size:11px; font-weight:600; color:var(--green); background:rgba(82,200,122,.14); border-radius:8px; padding:4px 10px; }
  .sync-warn { font-size:11px; font-weight:600; color:#e0a020; background:rgba(224,160,32,.12); border-radius:8px; padding:4px 10px; }
  .type-group { margin-bottom:16px; }
  .type-h { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:700; color:var(--gold); text-transform:uppercase; letter-spacing:.5px; cursor:pointer; user-select:none; padding:8px 2px; }
  .type-h .tg-caret { color:var(--muted); font-size:11px; }
  .type-h .gc { font-size:11px; color:var(--muted); font-weight:500; }
  /* borrower card Drive badge */
  .drive-badge { display:inline-block; font-size:9px; font-weight:700; border-radius:6px; padding:1px 6px; text-decoration:none; }
  .drive-badge.ok { color:#052b12; background:var(--green); }
  .drive-badge.wait { color:#111; background:#e0a020; }
  /* viewer modal */
  .viewer-ov { position:fixed; inset:0; z-index:260; background:rgba(0,0,0,.82); display:flex; align-items:center; justify-content:center; padding:24px; }
  .viewer { width:min(1000px,96vw); height:min(90vh,900px); background:#131315; border:1px solid rgba(201,168,76,.3); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; }
  .viewer-h { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .vh-name { font-size:14px; font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vh-type { font-size:10px; text-transform:uppercase; letter-spacing:.4px; color:var(--gold); background:rgba(201,168,76,.14); border-radius:6px; padding:2px 7px; flex-shrink:0; }
  .vh-actions { margin-left:auto; display:flex; gap:8px; flex-shrink:0; }
  .viewer-b { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; background:#0e0e10; position:relative; }
  .v-frame { width:100%; height:100%; border:none; background:#fff; }
  .v-fallback { position:absolute; bottom:10px; left:0; right:0; text-align:center; font-size:11px; color:var(--muted); }
  .v-fallback a { color:var(--gold); }
  .v-img { max-width:100%; max-height:100%; object-fit:contain; }
  .v-media { max-width:100%; max-height:100%; background:#000; }
  .v-audiowrap { padding:30px; width:100%; display:flex; justify-content:center; }
  .v-audio { width:min(500px,90%); }
  .v-unsupported { color:#ccc; font-size:14px; text-align:center; line-height:2; padding:30px; }
  .vloading { color:var(--muted); font-size:13px; }

  @media (max-width:820px){ .shell { grid-template-columns:1fr; } .side { display:none; } .side.show { display:block; position:fixed; inset:52px 0 0 0; z-index:60; } }
  @media (max-width:520px){ .grid { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); } }
</style>
</head>
<body>

<div class="header">
  <a href="/dashboard/admin.html" class="btn-back">← Dashboard</a>
  <a href="/admin/chat.html" class="btn-back">💬 Chat</a>
  <h1>🗄️ Vault</h1>
  <div class="spacer"></div>
  <span class="who" id="adminUserEmail"></span>
  <button class="btn-back" onclick="window.adminLogout && window.adminLogout()">Log out</button>
</div>

<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
    <div class="toolbar">
      <span class="title" id="secTitle">All files</span>
      <input class="search" id="search" type="text" placeholder="Search file name…" autocomplete="off">
      <div class="segbar" id="kindSeg">
        <button class="seg active" data-kind="all">All</button>
        <button class="seg" data-kind="image">Images</button>
        <button class="seg" data-kind="video">Videos</button>
        <button class="seg" data-kind="doc">Docs</button>
      </div>
      <select class="selg" id="groupSel">
        <option value="none">No grouping</option>
        <option value="lead">Group by lead</option>
        <option value="category">Group by type</option>
      </select>
      <span class="count" id="count"></span>
    </div>
    <div class="scroller" id="scroller"><div class="empty">Loading…</div></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var COLORS = ['#c9a84c', '#5aa0e0', '#52c87a', '#e07f50', '#ab7fe0', '#e0524f'];
  var SRC_LABEL = { chat: 'Chat', esign: 'E-Sign', borrower: 'Borrower' };
  var _sb = null, _items = [], _folders = [], _signed = {}, _borrowerSecs = [], _typeCollapsed = {};
  var _section = 'all', _kind = 'all', _q = '', _group = 'none';
  // thumbnail engine
  var _thumbCache = {}, _pdfjsPromise = null, _thumbObserver = null, _renderQueue = [], _activeRenders = 0;
  var MAX_RENDERS = 3, MAX_THUMB_BYTES = 25 * 1024 * 1024;
  function ex(it) { return (it && it.extra) || {}; }

  function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function humanSize(b) { b = Number(b) || 0; if (!b) return '—'; if (b < 1024) return b + ' B'; if (b < 1048576) return (b / 1024).toFixed(1) + ' KB'; return (b / 1048576).toFixed(1) + ' MB'; }
  function fmtDate(iso) { if (!iso) return ''; var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-US', { timeZone: 'America/Los_Angeles', month: 'short', day: 'numeric', year: 'numeric' }); }
  function itemKind(it) {
    var k = (it.category || '').toLowerCase(), m = (it.mime_type || '').toLowerCase(), n = (it.name || '').toLowerCase();
    if (k === 'image' || m.indexOf('image/') === 0 || /\.(jpe?g|png|gif|webp|bmp|heic|heif|tiff?)$/.test(n)) return 'image';
    if (k === 'video' || k === 'recording' || m.indexOf('video/') === 0 || /\.(mp4|webm|mov|m4v|avi|mkv)$/.test(n)) return 'video';
    if (k === 'audio' || m.indexOf('audio/') === 0 || /\.(mp3|wav|ogg|m4a|aac)$/.test(n)) return 'audio';
    return 'doc';
  }
  function isPdfItem(it) { return (it.mime_type || '').toLowerCase().indexOf('pdf') !== -1 || /\.pdf$/i.test(it.name || '') || it.source === 'esign'; }
  function folderById(id) { return _folders.filter(function (f) { return String(f.id) === String(id); })[0]; }
  function itemFolders(it) { try { return Array.isArray(it.folders) ? it.folders.map(String) : []; } catch (e) { return []; } }

  async function client() { if (_sb) return _sb; _sb = (typeof window.getSupabaseClient === 'function') ? await window.getSupabaseClient() : window._supabaseClient; return _sb; }

  // URL: public bucket → getPublicUrl; private → signed (cached ~55m).
  async function resolveUrl(it) {
    if (!it.storage_path) throw new Error('no file path');
    var sb = await client();
    if (it.is_public) { var pu = sb.storage.from(it.bucket).getPublicUrl(it.storage_path); return (pu.data && pu.data.publicUrl) || ''; }
    var key = it.bucket + '::' + it.storage_path, now = Date.now(), c = _signed[key];
    if (c && c.exp > now) return c.url;
    var r = await sb.storage.from(it.bucket).createSignedUrl(it.storage_path, 3600);
    if (r.error || !r.data) throw (r.error || new Error('sign failed'));
    _signed[key] = { url: r.data.signedUrl, exp: now + 55 * 60000 };
    return r.data.signedUrl;
  }
  async function realDownload(it) {
    try {
      var url = await resolveUrl(it);
      var res = await fetch(url); if (!res.ok) throw new Error('http ' + res.status);
      var blob = await res.blob(); var obj = URL.createObjectURL(blob);
      var a = document.createElement('a'); a.href = obj; a.download = it.name || 'download';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { try { URL.revokeObjectURL(obj); } catch (_) {} }, 5000);
    } catch (e) {
      try { var u = await resolveUrl(it); window.open(u, '_blank', 'noopener'); } catch (_) { alert('Could not download: ' + ((e && e.message) || 'error')); }
    }
  }
  async function openView(it) { try { var u = await resolveUrl(it); window.open(u, '_blank', 'noopener'); } catch (e) { alert('Could not open: ' + ((e && e.message) || 'error')); } }

  // ── load ──
  async function load() {
    try {
      var sb = await client();
      var a = await sb.rpc('vault_list'); if (a.error) throw a.error;
      var f = await sb.rpc('vault_folders_list'); if (f.error) throw f.error;
      _items = a.data || []; _folders = f.data || [];
      // Per-borrower sections: prefer the RPC (has the Drive-folder URL); fall back
      // to deriving from vault_list if it isn't deployed yet.
      try { var b = await sb.rpc('vault_borrower_sections'); _borrowerSecs = (!b.error && Array.isArray(b.data) && b.data.length) ? b.data : deriveBorrowerSecs(); }
      catch (_) { _borrowerSecs = deriveBorrowerSecs(); }
      renderSide(); render();
    } catch (e) {
      document.getElementById('scroller').innerHTML = '<div class="err">Couldn\'t load the vault: ' + esc((e && e.message) || 'error') + '</div>';
    }
  }

  function countFor(pred) { return _items.filter(pred).length; }
  function renderSide() {
    var side = document.getElementById('side');
    var secs = [
      { key: 'all', ico: '📁', name: 'All', n: _items.length },
      { key: 'chat', ico: '💬', name: 'Chat Files', n: countFor(function (x) { return x.source === 'chat'; }) },
      { key: 'esign', ico: '✍️', name: 'E-Sign Templates', n: countFor(function (x) { return x.source === 'esign'; }) },
      { key: 'borrower', ico: '📄', name: 'Borrower Docs', n: countFor(function (x) { return x.source === 'borrower'; }) }
    ];
    var html = '<div class="side-label">Library</div>' + secs.map(function (s) {
      var row = '<div class="side-item' + (_section === s.key ? ' active' : '') + '" data-sec="' + s.key + '">'
        + '<span class="si-ico">' + s.ico + '</span><span class="si-name">' + esc(s.name) + '</span><span class="si-count">' + s.n + '</span></div>';
      if (s.key === 'borrower') {
        row += _borrowerSecs.map(function (bs) {
          return '<div class="side-item sub' + (_section === 'borrower:' + bs.contact_id ? ' active' : '') + '" data-sec="borrower:' + esc(bs.contact_id) + '">'
            + '<span class="si-ico">👤</span><span class="si-name">' + esc(bs.lead_name || 'Unknown') + '</span>'
            + ((Number(bs.unsynced_count) || 0) > 0 ? '<span class="si-warn" title="' + (bs.unsynced_count) + ' not synced">⚠</span>' : '')
            + '<span class="si-count">' + (Number(bs.doc_count) || 0) + '</span></div>';
        }).join('');
      }
      return row;
    }).join('');
    html += '<div class="side-label">Folders</div>';
    html += _folders.map(function (fo) {
      return '<div class="side-item folder-row' + (_section === 'folder:' + fo.id ? ' active' : '') + '" data-sec="folder:' + esc(fo.id) + '">'
        + '<span class="si-dot" style="background:' + esc(fo.color || '#888') + '"></span>'
        + '<span class="si-name">' + esc(fo.name) + '</span>'
        + '<span class="si-count">' + (Number(fo.item_count) || 0) + '</span>'
        + '<span class="fr-tools"><button class="fr-btn" data-fedit="' + esc(fo.id) + '" title="Rename">✎</button>'

  // ── thumbnail engine: lazy (IntersectionObserver) + concurrency-capped renders ──

        resolve(window.pdfjsLib);

  function queueRender(job) { _renderQueue.push(job); pumpQueue(); }

  function renderPdfThumb(el, it, key) {
    el.classList.add('shimmer');

      return resolveUrl(it).then(function (url) {
        return pdfjs.getDocument({ url: url }).promise.then(function (pdf) {

  function hydrateOneThumb(el) {

  document.getElementById('groupSel').addEventListener('change', function () { _group = this.value; render(); });
  var st = null;
  document.getElementById('search').addEventListener('input', function () { var v = this.value.trim().toLowerCase(); clearTimeout(st); st = setTimeout(function () { _q = v; render(); }, 180); });
  document.getElementById('scroller').addEventListener('click', function (e) {
    var tt = e.target.closest('[data-typetoggle]');
    if (tt) { var key = tt.getAttribute('data-typetoggle'); _typeCollapsed[key] = !_typeCollapsed[key]; render(); return; }
    var card = e.target.closest('.card'); if (!card) return;
    var it = itemByKey(card.getAttribute('data-key')); if (!it) return;
    var actEl = e.target.closest('[data-act]');
    if (actEl) {
      var act = actEl.getAttribute('data-act');
      if (act === 'view') openViewer(it);
      else if (act === 'download') realDownload(it);
      else if (act === 'open') openView(it);
      else if (act === 'delete') deleteChat(it);
      else if (act === 'folder') openFolderPop(it, actEl);
      else if (act === 'unfolder') removeFromCurrentFolder(it);
      return;
    }
    openViewer(it);   // click anywhere else on the card → in-app viewer
  });
  document.addEventListener('click', function (e) { if (!e.target.closest('.pop') && !e.target.closest('[data-act="folder"]')) closePop(); });

  (function fillEmail(n) { n = n || 0; try { var u = window._adminUser; if (u && u.email) { var el = document.getElementById('adminUserEmail'); if (el) el.textContent = u.email; return; } } catch (e) {} if (n < 40) setTimeout(function () { fillEmail(n + 1); }, 150); })();
  function start() { if (typeof window.getSupabaseClient === 'function' || window._supabaseClient) load(); else setTimeout(start, 150); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
</body>
