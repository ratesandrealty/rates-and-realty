<!DOCTYPE html>
<!-- inbox.html · cache-buster v=2026072401 (Worker serves /admin/* HTML no-store) -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inbox — Rates & Realty CRM</title>
<script src="/admin/js/auth-guard.js?v=fe7946aab7"></script>
<script src="/api/env.js?v=2026033003"></script>
<link rel="stylesheet" href="/public/css/responsive-global.css">
<link rel="stylesheet" href="/public/css/crm-mobile.css">
<style>
:root{--gold:#c9a84c;--gold2:#e4b84e;--bg:#0a0a0a;--surface:#111;--surface2:#181818;--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);--text:#fff;--muted:rgba(255,255,255,0.38)}
*{box-sizing:border-box;margin:0;padding:0}
/* The page is a fixed-height app shell: topbar, then the inbox filling the rest.
   The page itself never scrolls — the thread list and reading pane own scrolling. */
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100%;overflow:hidden;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:0 16px;height:48px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;z-index:100}
.topbar-brand{font-weight:800;font-size:14px;color:var(--gold)}
.topbar a{color:var(--muted);text-decoration:none;font-size:12px;font-weight:600;padding:6px 10px;border-radius:6px;transition:all .15s}
.topbar a:hover{color:#fff;background:rgba(255,255,255,0.05)}
.topbar a.active{color:var(--gold);background:rgba(201,168,76,0.1)}
/* Was max-width:1180px;margin:0 auto — on a 1920px screen that is a 370px dead
   gutter each side, which is the "empty sidebar" in the screenshot. There is no
   sidebar on this page; the left rail now lives in that reclaimed width. */
.main{flex:1;min-height:0;display:flex;padding:10px 12px 12px}
#inboxHost{flex:1;min-width:0;min-height:0;display:flex}
@media (max-width:768px){ .topbar{overflow-x:auto} .main{padding:0} body{overflow:auto} }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-brand">Rates & Realty</span>
  <div style="width:1px;height:18px;background:var(--border2);margin:0 4px"></div>
  <a href="people">People</a>
  <a href="pipeline">Pipeline</a>
  <a href="communications">Communications</a>
  <a href="inbox" class="active">Inbox</a>
  <a href="lead-detail">Leads</a>
  <div style="flex:1"></div>
  <a href="settings">⚙ Settings</a>
  <a href="../dashboard/admin">Dashboard</a>
</div>

<div class="main">
  <!-- The old page-title row ("Inbox — Gmail · rene@ / processing@ — tag a thread
       to file it on a lead") is gone: the mailbox is shown in the rail switcher and
       the hint is a tooltip on the search row plus the reading pane's empty state. -->
  <div id="inboxHost"><div style="padding:40px;text-align:center;color:var(--muted)">Loading inbox…</div></div>
</div>

<!-- DOMPurify (Cure53 v3.4.12, vendored + SRI-pinned) MUST load before inbox.js — the
     composer refuses to open without it rather than risk sending unsanitized HTML. -->
<script src="/admin/js/vendor/purify.min.js?v=3.4.12"
        integrity="sha384-piCcpDdJ7qVeK4Tv8Z6Hpcr3ZBIgP16TxQTPVfsLFdZ5uDgwc3Y8Ho7oUnqf12qu"
        crossorigin="anonymous"></script>
  <script src="/admin/js/attachment-viewer.js?v=e8f2b14c9f"></script>
  <script src="/admin/js/inbox.js?v=c093251355"></script>
<script>
(function(){
  // Wait for auth-guard to establish the authenticated Supabase client, then mount.
  var tries=0;
  // Deep link: /admin/inbox?mailbox=processing@… opens that mailbox instead of the first.
  // mount() takes mailboxes[0] as the initial state.mailbox, so ORDER the list rather than
  // adding a new option — both stay in the switcher, and an unknown/absent value is ignored.
  // The server still re-checks the role, so this can only pick between mailboxes, not grant one.
  var MAILBOXES = ['rene@ratesandrealty.com','processing@ratesandrealty.com'];
  try {
    var want = (new URLSearchParams(location.search).get('mailbox') || '').trim().toLowerCase();
    if (want && MAILBOXES.indexOf(want) > 0) {
      MAILBOXES = [want].concat(MAILBOXES.filter(function(m){ return m !== want; }));
    }
  } catch (_) {}
  (function waitClient(){
    if (window._supabaseClient){
      window.GmailInbox.mount({
        el:'#inboxHost',
        client:window._supabaseClient,
        mailboxes:MAILBOXES,
        showSwitcher:true
      });
      return;
    }
    if (tries++ > 120){ document.getElementById('inboxHost').innerHTML='<div style="padding:40px;text-align:center;color:#f87171">Could not initialize session. Try reloading.</div>'; return; }
    setTimeout(waitClient, 50);
  })();
})();
</script>
</body>
</html>
