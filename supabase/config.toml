# have proved it — net.http_post is fire-and-forget, so "succeeded" only means
# the request was queued; the ROW is the evidence.
#
# The check itself lives in Postgres (public.verify_cron_secret), not in a Deno
# env var, so the plaintext never leaves the database — see the header comment in
# the function for why that matters.
# A dedicated secret was chosen over reading the JWT role claim because the latter
# would touch all 17 working guards to fix one function.
verify_jwt = true


