  <div class="topbar">

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   PUBLIC FEE-SHEET SNAPSHOT PAGE — /fee/<slug>
   Reads the slug from the path, fetches the frozen snapshot via the PUBLIC RPC
   get_fee_sheet_snapshot (anon), and renders a branded fee sheet. The math
   below is COPIED VERBATIM from tools/fee-sheet.html so the numbers match the
   staff tool to the dollar. Snapshot only — never editable, never other data.
   ═══════════════════════════════════════════════════════════════════════════ */

// ── formatting (verbatim: tools/fee-sheet.html) ──
const fmt = (n, decimals=2) => {
    if (n == null || isNaN(n)) return '$0.00';
    const abs = Math.abs(n);
    const str = abs.toLocaleString('en-US', {minimumFractionDigits: decimals, maximumFractionDigits: decimals});
    return n < 0 ? '<span class="credit">($'+str+')</span>' : '$'+str;
};
const parseCurrency = s => {
    if (!s) return 0;
    return parseFloat(String(s).replace(/[^0-9.\-]/g, '')) || 0;
};
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// ── rate-mode compute (verbatim: tools/fee-sheet.html) ──
function calcAppraisal(propertyType){ if(propertyType==='Condo')return 695; if(propertyType==='2-4 Unit')return 895; return 595; }
function calcRecordingFee(state){ const map={CA:125,TX:100,FL:150,NY:250}; return map[state]||125; }
function calcTitleLender(purchasePrice){ if(purchasePrice<=500000)return 450; if(purchasePrice<=1000000)return Math.round(450+(purchasePrice-500000)/1000*1.75); return Math.round(1325+(purchasePrice-1000000)/1000*1.50); }
function calcEscrow(purchasePrice){ return Math.max(purchasePrice/1000*2,500); }
function calcPI(loanAmount, annualRate, termYears){ if(loanAmount<=0||annualRate<=0)return 0; const r=annualRate/100/12, n=termYears*12; return loanAmount*(r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1); }
function getLoanTermYears(product){ return String(product||'').includes('15yr')?15:30; }
function calcMI(inp, rate){
    const product=inp.loanProduct, ltv=inp.ltv, totalLoanAmount=inp.totalLoanAmount||inp.loanAmount;
    if(product.startsWith('FHA')) return totalLoanAmount*0.0055/12;
    if(product.startsWith('VA')) return 0;
    if(product.startsWith('USDA')) return totalLoanAmount*0.0035/12;
    // Conventional PMI — flat 0.20% on base loan, only when LTV > 80% (matches tools/fee-sheet.html).
    if(ltv<=80) return 0;
    return inp.loanAmount*0.002/12;
}
function computeGovUpfrontFee(loanProduct, baseLoanAmount, downPaymentPct, vaConfig){
    if(!loanProduct||!baseLoanAmount) return null;
    const product=loanProduct.toUpperCase();
    const startsWithWord=(w)=>product===w||product.startsWith(w+' ');
    vaConfig=vaConfig||{};
    if(startsWithWord('FHA')){ const rate=0.0175; return {label:'FHA Upfront MIP (UFMIP, 1.75%)',rate,amount:+(baseLoanAmount*rate).toFixed(2),financed:true}; }
    if(startsWithWord('VA')){
        if(vaConfig.exempt) return null;
        const dp=downPaymentPct||0; let rate;
        if(vaConfig.firstUse!==false){ if(dp<5)rate=0.0215; else if(dp<10)rate=0.0150; else rate=0.0125; }
        else { if(dp<5)rate=0.0330; else if(dp<10)rate=0.0150; else rate=0.0125; }
        const useLabel=vaConfig.firstUse!==false?'1st use':'subsequent';
        return {label:'VA Funding Fee ('+useLabel+', '+(rate*100).toFixed(2)+'%)',rate,amount:+(baseLoanAmount*rate).toFixed(2),financed:true};
    }
    if(startsWithWord('USDA')){ const rate=0.01; return {label:'USDA Upfront Guarantee Fee (1.00%)',rate,amount:+(baseLoanAmount*rate).toFixed(2),financed:true}; }
    return null;
}
function calcScenario(inp, sc){
    const la=inp.loanAmount, totalLa=inp.totalLoanAmount||la, pp=inp.purchasePrice;
    const govFeeAmount=(inp.govFee&&inp.govFee.financed)?inp.govFee.amount:0;
    /* origFee ARRIVES PRE-COMPUTED. get_fee_sheet_snapshot strips origComp — the
       compensation rate — and substitutes the dollar figure it produced, using this
       exact formula, so subtotalA and everything downstream are unchanged. Verified
       across 60 scenarios in 10 live snapshots: 0 mismatches.
       The fallback keeps this function usable if it is ever handed an unredacted
       scenario (the staff tool shares this file's maths lineage), but on the public
       page origComp is absent and origFee is authoritative. */
    const origFee=(sc.origFee!=null)?Number(sc.origFee):(la*(sc.origComp||0)/100), discountPoints=la*sc.points/100, uwFee=1350, adminFee=185;
    const subtotalA=origFee+discountPoints+uwFee+adminFee;
    const appraisal=calcAppraisal(inp.propertyType), creditReport=65, floodCert=12, taxService=85, mersReg=24.95, processingFee=995;
    const subtotalB=appraisal+creditReport+floodCert+taxService+mersReg+processingFee+govFeeAmount;
    const titleLender=calcTitleLender(pp), escrow=calcEscrow(pp), recording=calcRecordingFee(inp.state), notary=175, loanTieIn=150, messengerFee=125, subEscrowFee=50;
    const subtotalC=titleLender+escrow+recording+notary+loanTieIn+messengerFee+subEscrowFee;
    const totalLoanCosts=subtotalA+subtotalB+subtotalC;
    const dailyInterest=la*(sc.rate/100)/365, prepaidInterest=dailyInterest*3, prepaidInsurance=inp.annualInsurance;
    const subtotalE=prepaidInterest+prepaidInsurance;
    const taxReserve=inp.annualTax/12*3, insReserve=inp.annualInsurance/12*2, subtotalF=taxReserve+insReserve;
    const totalOther=subtotalE+subtotalF, totalClosing=totalLoanCosts+totalOther;
    const lenderCreditLine=sc.lenderCredits;
    const cashToClose=inp.downPayment+totalClosing-lenderCreditLine-govFeeAmount;
    const termYears=getLoanTermYears(inp.loanProduct);
    const pi=calcPI(totalLa,sc.rate,termYears), monthlyTax=inp.annualTax/12, monthlyIns=inp.annualInsurance/12, mi=calcMI(inp,sc.rate);
    const totalMonthly=pi+monthlyTax+monthlyIns+mi;
    return { origFee,discountPoints,uwFee,adminFee,subtotalA,govFeeAmount,appraisal,creditReport,floodCert,taxService,mersReg,processingFee,subtotalB,
        titleLender,escrow,recording,notary,loanTieIn,messengerFee,subEscrowFee,subtotalC,totalLoanCosts,
        prepaidInterest,prepaidInsurance,subtotalE,taxReserve,insReserve,subtotalF,totalOther,totalClosing,lenderCreditLine,cashToClose,
        pi,monthlyTax,monthlyIns,mi,totalMonthly };
}
// Product short-code → full label (verbatim: tools/fee-sheet.html PRODUCT_CODE_TO_FULL).
const PRODUCT_CODE_TO_FULL={conv30:'Conv 30yr Fixed',conv15:'Conv 15yr Fixed',fha30:'FHA 30yr Fixed',va30:'VA 30yr Fixed',usda30:'USDA 30yr Fixed',jumbo30:'Jumbo 30yr Fixed'};
// Build the compute `inp` from the frozen common block + optional per-column overrides —
// mirrors tools/fee-sheet.html readSidebarInputs EXACTLY, including the property-mode tax
// rule (usePctTax = overrides.purchasePrice != null || taxMode==='pct').
function buildInp(c, ov){
    c=c||{}; ov=ov||{};
    const purchasePrice=(ov.purchasePrice!=null)?Number(ov.purchasePrice):parseCurrency(c.purchasePrice);
    const downPct=(ov.downPct!=null)?Number(ov.downPct):(parseFloat(c.downPct)||0);
    const downPayment=purchasePrice*downPct/100;
    const loanAmount=Math.max(0,purchasePrice-downPayment);
    const loanProduct=(ov.loanProduct!=null)?ov.loanProduct:(c.loanProduct||'');
    const vaConfig={ firstUse:true, exempt:false };   // not captured in the draft → tool defaults
    const govFee=computeGovUpfrontFee(loanProduct, loanAmount, downPct, vaConfig);
    const totalLoanAmount=(govFee&&govFee.financed)?+(loanAmount+govFee.amount).toFixed(2):loanAmount;
    const ltv=purchasePrice>0?(loanAmount/purchasePrice*100):0;
    let annualTax;
    const usePctTax=(ov.purchasePrice!=null)||((c.taxMode||'pct')==='pct');
    if(usePctTax){ const pct=parseFloat(c.taxPct)||1.25; annualTax=purchasePrice*pct/100; }
    else { const at=parseCurrency(c.annualTax); annualTax=at>0?at:purchasePrice*0.0125; }
    const insIn=parseCurrency(c.annualInsurance);
    const annualInsurance=(ov.annualInsurance!=null)?Number(ov.annualInsurance):(insIn>0?insIn:1800);
    return { borrowerName:c.borrowerName||'Borrower', propertyAddress:c.propertyAddress||'', purchasePrice, downPct, downPayment,
        loanAmount, totalLoanAmount, govFee, vaConfig, ltv, loanProduct, lockPeriod:c.lockPeriod||'',
        propertyType:(ov.propertyType!=null)?ov.propertyType:(c.propertyType||''), creditScore:c.creditScore||'',
        state:c.state||'CA', county:c.county||'', annualTax, annualInsurance, hoa:ov.hoa||0, monthlyRent:ov.monthlyRent||0 };
}
function inpFromCommon(c){ return buildInp(c, null); }
// One property-comparison column (verbatim path: applyColumnOverrides → calcScenario + net
// payment). Net payment = PITI + HOA − gross rent (matches the admin tool to the dollar).
function calcPropertyColumn(c, col){
    const inp=buildInp(c, { purchasePrice:col.purchasePrice, downPct:(col.downPct!=null?col.downPct:20),
        loanProduct:PRODUCT_CODE_TO_FULL[col.loanProduct]||col.loanProduct, propertyType:col.propertyType, hoa:col.hoa, monthlyRent:col.monthlyRent });
    /* Property mode always priced origination at 1.5% regardless of the stored
       column value; the redactor computes origFee with the same 1.5 so this stays
       identical. */
    const sc={ id:col.id, label:col.label, rate:col.rate, points:0, origFee:col.origFee, origComp:1.5, lenderCredits:0, recommended:!!col.recommended };
    const r=calcScenario(inp, sc);
    r.monthlyHoa=col.hoa||0; r.monthlyRent=col.monthlyRent||0;
    r.netPayment=r.totalMonthly + r.monthlyHoa - r.monthlyRent;
    r.inp=inp; return r;
}
// One price-comparison column (verbatim path: applyColumnOverrides → calcScenario). Same
// per-column input synthesis as property mode, but the scenario carries THIS column's own
// rate/points/origComp/lenderCredits so the fee schedule + cash-to-close match the admin tool
// to the dollar. Mirrors tools/fee-sheet.html calcPriceColumn.
function calcPriceColumn(c, col){
    const inp=buildInp(c, { purchasePrice:col.purchasePrice, downPct:(col.downPct!=null?col.downPct:20),
        loanProduct:PRODUCT_CODE_TO_FULL[col.loanProduct]||col.loanProduct, propertyType:col.propertyType });
    /* origComp is redacted out of the payload, so defaulting it to 1.5 here would
       silently invent a compensation rate and produce a DIFFERENT origination fee
       than the one the sheet was built with. Carry the server's origFee instead. */
    const sc={ id:col.id, label:col.label, rate:col.rate, points:col.points||0, origFee:col.origFee, origComp:col.origComp, lenderCredits:col.lenderCredits||0, recommended:!!col.recommended };
    const r=calcScenario(inp, sc);
    r.netPayment=r.totalMonthly;
    r.inp=inp; r.sc=sc; return r;
}

// ── heloc compute (verbatim: tools/fee-sheet.html) ──
function _helocMoney(n){ if(n==null||isNaN(n))return '$0'; return '$'+Math.round(n).toLocaleString('en-US'); }
function helocCompute(card, drawAmount, origPct, autopay){
    const rate=parseFloat(card.rate)||0, term=parseInt(card.term,10)||0;
    const origFee=drawAmount*(origPct/100), totalLoan=drawAmount+origFee;
    const effRate=autopay?Math.max(0,rate-0.25):rate;
    const r=effRate/100/12, n=term*12; let monthly;
    if(n<=0)monthly=0; else if(r<=0)monthly=totalLoan/n; else monthly=totalLoan*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
    return { origFee, totalLoan, monthly, effRate, rate, term };
}
function _helocRate(r){ let s=(parseFloat(r)||0).toFixed(3); s=s.replace(/\.?0+$/,''); return s; }

// ── shared UI bits ──
const PHONE='+17144728508', PHONE_DISP='(714) 472-8508';
function preparedBlock(){
    return '<div class="prepared">'
      +'<div class="by">Prepared by</div>'
      +'<div class="nm">Rene Duarte, Rates &amp; Realty</div>'
      +'<div class="lic">NMLS #1416824 &middot; CA DRE #01986350</div>'
      +'<div class="cta">'
        +'<a class="call" href="tel:'+PHONE+'">📞 Call Rene</a>'
        +'<a class="text" href="sms:'+PHONE+'">💬 Text Rene</a>'
      +'</div></div>';
}
function disclaimer(created){
    const when = created ? new Date(created).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}) : '';
    return '<div class="disclaimer">Estimate only — this is not a Loan Estimate, pre-approval, or commitment to lend. '
      +'Figures are based on the information provided and are subject to change with credit approval, property details, '
      +'final underwriting, and market rates.'+(when?' Prepared '+esc(when)+'.':'')+'</div>';
}
function row(label, value, cls){ return '<div class="row '+(cls||'')+'"><span class="rl">'+label+'</span><span class="rv">'+value+'</span></div>'; }
function catRow(label){ return '<div class="row cat"><span class="rl">'+label+'</span></div>'; }
function kv(k,v){ return '<div class="kv"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'; }
// Header-level list of ALL borrowers / connected people (data._people, Primary first). Rendered
// as a centered wrapping row of dark/gold chips — one per person, with a person icon and an
// optional muted relationship sub-label. Only shown when 2+ people exist (the lone primary is
// already the <h1> title). Missing/empty _people (older snapshots) → '' (no row, never errors).
function peopleRow(data){
    const people = Array.isArray(data && data._people) ? data._people.filter(p => p && p.name) : [];
    if(people.length < 2) return '';
    let h='<div class="people">';
    people.forEach(p=>{
        const rel = p.relationship ? '<span class="rel"> · '+esc(p.relationship)+'</span>' : '';
        h += '<span class="chip"><span class="pi">👤</span><span class="nm">'+esc(p.name)+rel+'</span></span>';
    });
    return h+'</div>';
}
// Header borrower display: when the people-chip row is showing (2+ people) the chips ARE the
// borrower list, so we DROP the big <h1> name to avoid rendering the primary twice. With 0/1
// person (no chip row) we keep the <h1> name exactly as before.
function headerName(name, data){
    const ppl = peopleRow(data);
    return ppl ? ppl : '<h1>'+esc(name)+'</h1>';
}

// Itemized closing-cost breakdown for ONE scenario — grouped/labeled like tools/fee-sheet.html.
// PRESENTATION ONLY: every value is read off the already-computed calcScenario result `r`; the
// subtotal reconciles to the SAME cashToClose already shown (down + totalClosing − lenderCredit
// − financed gov fee). Negative points / lender credits are already inside r.discountPoints /
// r.lenderCreditLine, so they are never double-counted here. `sc` = scenario (points/credits),
// `rinp` = the compute input for this scenario (per-column in property mode).
function feeBreakdown(r, sc, rinp){
    sc = sc || { points:0, lenderCredits:0 };
    rinp = rinp || {};
    const down = (rinp.downPayment!=null) ? rinp.downPayment : 0;
    const govFinanced = !!(rinp.govFee && rinp.govFee.financed && r.govFeeAmount);
    const govLabel = (rinp.govFee && rinp.govFee.label) || 'Upfront Gov Fee';
    return '<div class="rows fee-body">'
      + catRow('A · Origination Charges')
      + row('Origination Fee', fmt(r.origFee))
      + (r.discountPoints?row('Discount Points', fmt(r.discountPoints)):'')
      + row('Underwriting Fee', fmt(r.uwFee))
      + row('Admin Fee', fmt(r.adminFee))
      + row('Subtotal A', fmt(r.subtotalA), 'sub')
      + catRow('B · Services You Cannot Shop For')
      + (r.govFeeAmount?row(esc(govLabel), fmt(r.govFeeAmount)):'')
      + row('Appraisal Fee', fmt(r.appraisal))
      + row('Credit Report', fmt(r.creditReport))
      + row('Flood Certification', fmt(r.floodCert))
      + row('Tax Service Fee', fmt(r.taxService))
      + row('MERS Registration', fmt(r.mersReg))
      + row('Processing Fee', fmt(r.processingFee))
      + row('Subtotal B', fmt(r.subtotalB), 'sub')
      + catRow('C · Services You Can Shop For')
      + row("Title — Lender's Policy", fmt(r.titleLender))
      + row('Escrow / Settlement Fee', fmt(r.escrow))
      + row('Recording Fees', fmt(r.recording))
      + row('Notary Fee', fmt(r.notary))
      + row('Loan Tie-In Fee', fmt(r.loanTieIn))
      + row('Messenger Fee', fmt(r.messengerFee))
      + row('Sub-Escrow Fee', fmt(r.subEscrowFee))
      + row('Subtotal C', fmt(r.subtotalC), 'sub')
      + row('Total Loan Costs (A+B+C)', fmt(r.totalLoanCosts), 'sub')
      + catRow('E · Prepaids')
      + row('Prepaid Interest (3 days)', fmt(r.prepaidInterest))
      + row("Homeowner's Insurance (12 mo)", fmt(r.prepaidInsurance))
      + row('Subtotal E', fmt(r.subtotalE), 'sub')
      + catRow('F · Initial Escrow at Closing')
      + row('Property Tax Reserve (3 mo)', fmt(r.taxReserve))
      + row('Hazard Insurance Reserve (2 mo)', fmt(r.insReserve))
      + row('Subtotal F', fmt(r.subtotalF), 'sub')
      + row('Total Other Costs (E+F)', fmt(r.totalOther), 'sub')
      + row('Total Closing Costs', fmt(r.totalClosing), 'sub')
      /* The credit is still subtracted inside cashToClose — only the LINE is
         suppressed. Hiding the number from the arithmetic would raise the
         borrower's cash to close by the credit amount. */
      + ((r.lenderCreditLine && (window.__SEC||{}).lender_credits)?row('Less: Lender Credits', fmt(-r.lenderCreditLine)):'')
      + (govFinanced?row('Less: Financed ('+esc(govLabel)+')', fmt(-r.govFeeAmount)):'')
      + row('Down Payment', fmt(down))
      + row('Estimated Cash to Close', fmt(r.cashToClose), 'total')
      +'</div>';
}
// HELOC has no closing-cost schedule (cash at closing = $0); surface the per-option loan
// breakdown instead — same figures the "Loan Breakdown" section shows, but per card.
function helocBreakdown(r, draw, value, cltv, balance, origPct, autopay){
    return '<div class="rows fee-body">'
      + row('Initial Draw Amount', _helocMoney(draw))
      + row('Origination Fee ('+esc(_helocRate(origPct))+'%)', _helocMoney(r.origFee))
      + row('Total Loan Amount', _helocMoney(r.totalLoan), 'sub')
      + row('Term', r.term+' yrs / '+(r.term*12)+' mo.')
      + row('Effective Rate', esc(_helocRate(r.effRate))+'%'+((autopay&&r.rate!==r.effRate)?' (AutoPay −0.25%)':''))
      + (value>0?row('Home Value', _helocMoney(value)):'')
      + (cltv?row('CLTV', esc(_helocRate(cltv))+'%'):'')
      + (balance>0?row('Existing Balance', _helocMoney(balance)):'')
      + row('Cash Required at Closing', '$0', 'sub')
      + row('Estimated Monthly Payment', _helocMoney(r.monthly), 'total')
      +'</div>';
}
/* The itemised A/B/C/E/F breakdown is opt-in. Every caller routes through this
   one helper, so gating here covers rate, price and property modes without
   three separate checks that could drift apart. Returns '' when not opted in —
   no empty <details> stub, which would advertise that something is hidden. */
function feeDetails(inner){
    if(!(window.__SEC||{}).fee_schedule) return '';
    return '<details class="fee-details"><summary>View fee details</summary>'+inner+'</details>';
}

// ── RATE / SINGLE render ──
function renderRate(snap){
    const data=snap.data||{}, c=data.common||{}, mode=data.mode||'rate';
    const inp=inpFromCommon(c);
    let scenarios=Array.isArray(data.scenarios)?data.scenarios.slice():[];
    if(mode==='single') scenarios=scenarios.slice(0,1);
    if(!scenarios.length) scenarios=[{id:'A',label:'Estimate',rate:0,points:0,origComp:0,lenderCredits:0,recommended:true}];
    let recIdx=scenarios.findIndex(s=>s.recommended); if(recIdx<0)recIdx=0;
    const rec=scenarios[recIdx], recR=calcScenario(inp,rec);
    const name=snap.borrower_name||inp.borrowerName||'Borrower';
    const termYears=getLoanTermYears(inp.loanProduct);

    let h='<div class="hero">'
      +'<div class="eyebrow">Loan Estimate</div>'
      + headerName(name, data)
      +(inp.propertyAddress?'<div class="addr">'+esc(inp.propertyAddress)+'</div>':'')
      +'<div class="product">'
        +(inp.lockPeriod?'<span class="badge">🔒 '+esc(inp.lockPeriod)+'</span>':'')
      +'</div>'
      + typeBadges(inp.loanProduct, inp.propertyType, true)
      +'<div class="payhero"><div class="lbl">Estimated Monthly Payment</div>'
        +'<div class="amt">'+fmt(recR.totalMonthly,0)+'<small>/mo</small></div>'
        +'<div class="rate">'+esc(_helocRate(rec.rate))+'% rate'+(rec.label?' · '+esc(rec.label):'')+' · '+termYears+'-yr</div>'
      +'</div></div>';

    // Loan summary
    h+='<div class="sec"><div class="sec-title">Loan Summary</div><div class="card"><div class="grid2">'
      + kv('Purchase Price', fmt(inp.purchasePrice,0))
      + kv('Down Payment', fmt(inp.downPayment,0)+' · '+(inp.downPct||0)+'%')
      + kv('Loan Amount', fmt(inp.loanAmount,0))
      + kv('Rate', esc(_helocRate(rec.rate))+'%')
      + kv('Term', termYears+' years')
      + kv('Credit Score', esc(inp.creditScore||'—'))
      + (inp.propertyType?kv('Property Type', esc(propTypeMeta(inp.propertyType).label)):'')
      + (inp.loanProduct?kv('Loan Type', esc(loanTypeMeta(inp.loanProduct).label)):'')
      + (inp.lockPeriod?kv('Rate Lock', esc(inp.lockPeriod)):'')
      +'</div></div></div>';

    // Monthly breakdown (recommended)
    h+='<div class="sec"><div class="sec-title">Estimated Monthly Payment</div><div class="card"><div class="rows">'
      + row('Principal &amp; Interest', fmt(recR.pi))
      + row('Property Taxes', fmt(recR.monthlyTax))
      + row("Homeowner's Insurance", fmt(recR.monthlyIns))
      + (recR.mi>0?row('Mortgage Insurance', fmt(recR.mi)):'')
      + row('Total Monthly Payment', fmt(recR.totalMonthly), 'total')
      +'</div></div></div>';

    // Rate options (rate mode with >1 scenario)
    if(scenarios.length>1){
        h+='<div class="sec"><div class="sec-title">Rate Options</div><div class="opts">';
        scenarios.forEach((s,i)=>{
            const r=calcScenario(inp,s);
            const pts = s.points>0 ? (s.points+' pts') : (s.points<0 ? 'credit' : 'no points');
            h+='<div class="opt'+(i===recIdx?' rec':'')+'">'
              +'<div class="opt-head"><span class="opt-name">'+esc(s.label||('Option '+(s.id||''))) +(i===recIdx?' <span class="badge rec">Recommended</span>':'')+'</span><span class="opt-rate">'+esc(_helocRate(s.rate))+'%</span></div>'
              +'<div class="opt-meta">'
                +'<div class="m"><div class="k">Monthly</div><div class="v">'+fmt(r.totalMonthly,0)+'</div></div>'
                +'<div class="m"><div class="k">Points</div><div class="v">'+esc(pts)+'</div></div>'
                +'<div class="m"><div class="k">Cash to Close</div><div class="v">'+fmt(r.cashToClose,0)+'</div></div>'
              +'</div>'
              + feeDetails(feeBreakdown(r, s, inp))
              +'</div>';
        });
        h+='</div></div>';
    }

    // Closing costs (recommended) — summary + itemized detail
    h+='<div class="sec"><div class="sec-title">Estimated Closing Costs</div><div class="card"><div class="rows">'
      + row('Total Loan Costs', fmt(recR.totalLoanCosts))
      + row('Total Other Costs', fmt(recR.totalOther))
      + row('Total Closing Costs', fmt(recR.totalClosing), 'sub')
      + ((rec.lenderCredits && (window.__SEC||{}).lender_credits)?row('Lender Credits', fmt(-recR.lenderCreditLine)):'')
      + row('Down Payment', fmt(inp.downPayment))
      + row('Estimated Cash to Close', fmt(recR.cashToClose), 'total')
      +'</div>'
      + feeDetails(feeBreakdown(recR, rec, inp))
      +'</div></div>';

    h+=disclaimer(snap.created_at)+preparedBlock();
    document.getElementById('app').innerHTML=h;
}

// ── PROPERTY-COMPARISON render (mode 'property' → SFR/Condo/2-4 Unit columns) ──
function _propTypeLabel(t){ return ({sfr:'Single Family',condo:'Condo',multifamily:'2-4 Unit',townhouse:'Townhouse'})[String(t||'').toLowerCase()] || esc(t||''); }
// Human-readable label + emoji for a loan product — accepts either a short code ('conv30')
// or a full string ('Conv 30yr Fixed' / 'FHA 30yr Fixed'), so it works for per-column codes
// AND the common.loanProduct full strings used by rate/single mode.
function loanTypeMeta(v){
    const s=String(v||'').toLowerCase();
    let prog='Conventional', emoji='🏦';
    if(s.includes('fha')){ prog='FHA'; emoji='📋'; }
    else if(s.includes('usda')){ prog='USDA'; emoji='🌾'; }
    else if(/(^|[^a-z])va([^a-z]|\d|$)/.test(s)||s.startsWith('va')){ prog='VA'; emoji='🎖️'; }
    else if(s.includes('jumbo')){ prog='Jumbo'; emoji='💎'; }
    else { prog='Conventional'; emoji='🏦'; }
    const term = s.includes('15') ? '15yr' : (s.includes('20') ? '20yr' : '30yr');
    return { label: prog+' '+term, emoji };
}
// Human-readable label + emoji for a property type — tolerant of codes ('sfr') or labels ('SFR').
function propTypeMeta(t){
    const s=String(t||'').toLowerCase();
    if(s.includes('condo')) return { label:'Condo', emoji:'🏢' };
    if(s.includes('multi')||s.includes('2-4')||s.includes('unit')) return { label:'2-4 Unit', emoji:'🏘️' };
    if(s.includes('town')) return { label:'Townhouse', emoji:'🏡' };
    if(s.includes('manuf')) return { label:'Manufactured', emoji:'🏚️' };
    if(s.includes('sfr')||s.includes('single')||s.includes('family')) return { label:'Single Family', emoji:'🏠' };
    return { label: t?esc(String(t)):'—', emoji:'🏠' };
}
// Small pill pair (loan type + property type) shown on each scenario card / in the hero.
function typeBadges(loanVal, propVal, center){
    const L=loanTypeMeta(loanVal), P=propTypeMeta(propVal);
    let h='<div class="typebadges'+(center?' center':'')+'">';
    if(loanVal) h+='<span class="tb">'+esc(L.label)+' <span class="em">'+L.emoji+'</span></span>';
    if(propVal) h+='<span class="tb">'+esc(P.label)+' <span class="em">'+P.emoji+'</span></span>';
    return h+'</div>';
}

// ── HELOC render ──
function renderHeloc(snap){
    const data=snap.data||{}, hd=data.heloc||{};
    const name=snap.borrower_name||(data.common&&data.common.borrowerName)||'Borrower';
    const draw=parseCurrency(hd.draw), value=parseCurrency(hd.value), balance=parseCurrency(hd.balance);
    const cltv=parseFloat(hd.cltv)||0, autopay=!!hd.autopay;
    const origOptions=Array.isArray(hd.origOptions)?hd.origOptions:[2.99];
    const origSel=(typeof hd.origSelected==='number'&&hd.origSelected>=0&&hd.origSelected<origOptions.length)?hd.origSelected:0;
    const origPct=parseFloat(origOptions[origSel])||0;
    let cards=Array.isArray(hd.cards)?hd.cards.slice():[];
    if(!cards.length) cards=[{type:'fixed',term:30,rate:0,selected:true}];
    let selIdx=cards.findIndex(c=>c.selected); if(selIdx<0)selIdx=0;
    const selCard=cards[selIdx], selR=helocCompute(selCard, draw, origPct, autopay);

    let h='<div class="hero">'
      +'<div class="eyebrow">HELOC Estimate</div>'
      + headerName(name, data)
      +'<div class="product"><span class="badge">Home Equity Line</span>'+(autopay?'<span class="badge">AutoPay −0.25%</span>':'')+'</div>'
      +'<div class="payhero"><div class="lbl">Estimated Monthly Payment</div>'
        +'<div class="amt">'+_helocMoney(selR.monthly)+'<small>/mo</small></div>'
        +'<div class="rate">'+esc(_helocRate(selR.effRate))+'% · '+selR.term+'yr '+esc(selCard.type||'fixed')+(autopay&&selR.rate!==selR.effRate?' (AutoPay)':'')+'</div>'
      +'</div></div>';

    // Rate options
    h+='<div class="sec"><div class="sec-title">Rate Options</div><div class="opts">';
    cards.forEach((card,i)=>{
        const r=helocCompute(card, draw, origPct, autopay);
        h+='<div class="opt'+(i===selIdx?' rec':'')+'">'
          +'<div class="opt-head"><span class="opt-name">'+esc(r.term)+'yr '+esc(card.type||'fixed')+(i===selIdx?' <span class="badge rec">Selected</span>':'')+'</span><span class="opt-rate">'+esc(_helocRate(r.effRate))+'%</span></div>'
          +'<div class="opt-meta">'
            +'<div class="m"><div class="k">Monthly</div><div class="v">'+_helocMoney(r.monthly)+'</div></div>'
            +'<div class="m"><div class="k">Term</div><div class="v">'+esc(r.term)+' yrs</div></div>'
            +'<div class="m"><div class="k">Type</div><div class="v">'+esc(card.type||'fixed')+'</div></div>'
          +'</div>'
          + feeDetails(helocBreakdown(r, draw, value, cltv, balance, origPct, autopay))
          +'</div>';
    });
    h+='</div></div>';

    // Loan breakdown
    h+='<div class="sec"><div class="sec-title">Loan Breakdown</div><div class="card"><div class="rows">'
      + row('Initial Draw Amount', _helocMoney(draw))
      + row('Origination Fee ('+esc(_helocRate(origPct))+'%)', _helocMoney(selR.origFee))
      + row('Total Loan Amount', _helocMoney(selR.totalLoan), 'sub')
      + row('Term', selR.term+' yrs / '+(selR.term*12)+' mo.')
      + (value>0?row('Home Value', _helocMoney(value)):'')
      + (cltv?row('CLTV', esc(_helocRate(cltv))+'%'):'')
      + (balance>0?row('Existing Balance', _helocMoney(balance)):'')
      + row('Cash Required at Closing', '$0')
      + row('Estimated Monthly Payment', _helocMoney(selR.monthly), 'total')
      + (autopay?row('AutoPay Discount', '−0.25% APR (effective '+esc(_helocRate(selR.effRate))+'%)'):'')
      +'</div></div></div>';

    // Origination options
    if(origOptions.length>1){
        h+='<div class="sec"><div class="sec-title">Origination Options</div><div class="card"><div class="rows">';
        origOptions.forEach((o,i)=>{ const pct=parseFloat(o)||0; h+=row(esc(_helocRate(pct))+'% origination'+(i===origSel?' <span class="badge rec" style="margin-left:6px">Selected</span>':''), _helocMoney(draw*pct/100)); });
        h+='</div></div></div>';
    }

    h+=disclaimer(snap.created_at)+preparedBlock();
    document.getElementById('app').innerHTML=h;
}

/* One page for every "you cannot see this" outcome, worded so the visitor knows
   it is the LINK that ended, not the site that failed. Deliberately does NOT say
   which of revoked / expired / never-existed it was: that distinction is useful
   to Rene and is available to him in the link list, and telling an arbitrary
   holder of a URL "this was revoked" confirms the sheet exists. */
function renderNotFound(status){
    const head = (status === 'expired') ? 'This link has expired'
               : (status === 'revoked') ? 'This link is no longer available'
               : 'Link expired or not found';
    document.getElementById('app').innerHTML='<div class="center"><div>'
      +'<div style="font-size:2rem;margin-bottom:8px">🔗</div>'
      +'<h1 style="font-size:1.3rem;color:var(--gold);margin-bottom:8px">'+head+'</h1>'
      +'<p class="muted" style="max-width:340px;margin:0 auto 18px">This fee-sheet link is no longer available. Reach out to Rene for an updated estimate.</p>'
      +'<div class="cta" style="justify-content:center"><a class="call" href="tel:'+PHONE+'">📞 Call Rene</a><a class="text" href="sms:'+PHONE+'">💬 Text Rene</a></div>'
      +'</div></div>';
}
function renderError(msg){
    document.getElementById('app').innerHTML='<div class="center"><div>'
      +'<div style="font-size:2rem;margin-bottom:8px">⚠️</div>'
      +'<h1 style="font-size:1.2rem;color:var(--gold);margin-bottom:8px">Couldn\'t load this estimate</h1>'
      +'<p class="muted" style="max-width:340px;margin:0 auto">'+esc(msg||'Please try again in a moment.')+'</p>'
      +'</div></div>';
}

// ── init ──
(async function(){
    try{
        const m = location.pathname.match(/\/fee\/([A-Za-z0-9]+)/);
        const slug = m ? m[1] : '';
        if(!slug){ renderNotFound(); return; }
        const cfg = window.APP_CONFIG || {};
        if(typeof window.supabase==='undefined' || !cfg.SUPABASE_URL){ renderError('Configuration unavailable.'); return; }
        const client = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
        const { data, error } = await client.rpc('get_fee_sheet_snapshot', { p_slug: slug });
        if(error){ console.warn('[fee]', error.message); renderError('This estimate is temporarily unavailable.'); return; }
        if(!data){ renderNotFound(); return; }
        /* The RPC now answers with an explicit status so a withdrawn link reads as
           WITHDRAWN rather than broken. Returning null for these would render the
           blank/error page, which tells a borrower the site is down when in fact
           Rene took the link back. Unknown statuses fall through to not-found
           rather than rendering a sheet — fail closed on a public surface. */
        if(data.status && data.status !== 'ok'){ renderNotFound(data.status); return; }
        /* Section visibility is OPT-IN and resolved server-side; an older payload
           with no `sections` key means nothing was opted in, so default to all
           false rather than all true. Failing open here would undo the point. */
        window.__SEC = Object.assign({lender_credits:false,fee_schedule:false,people:false}, data.sections||{});
        const mode = (data.data && data.data.mode) || 'rate';
        document.title = (data.borrower_name?data.borrower_name+' — ':'')+'Loan Estimate | Rates & Realty';
        // Mirror the admin tool per mode: property → SFR/Condo/2-4 Unit comparison;
        // price → per purchase-price-point columns; heloc → heloc; rate/single
        // (and any unknown) → A/B/C rate scenarios. STRICT per-mode arrays — no cross-leak.
        if(mode==='heloc') renderHeloc(data);
        else if(mode==='property') renderProperty(data);
        else if(mode==='price') renderPrice(data);
        else renderRate(data);
    }catch(e){ console.error('[fee] init', e); renderError(e && e.message); }
})();
</script>
