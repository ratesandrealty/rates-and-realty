<meta charset="utf-8"><title>dead send fixture</title>
<!-- BREAK TEST for the "Send actually sends" spec.
     The composer renders perfectly. #sc-input exists, [data-sc-send] exists and
     is styled exactly like the live one. There is simply no handler behind it —
     the dead-button case the spec must catch. A presence-only assertion passes
     this page, which is the whole point. -->
<body style="background:#0d0d0d;color:#eee;font-family:system-ui;padding:20px">
<div id="sc-messages" style="min-height:120px">
  <div>Existing message</div>
  <div>Some more visible text so the text floor is comfortably cleared here.</div>
</div>
<div class="sc-composer">
  <input id="sc-input" type="text" placeholder="Message…">
  <button class="sc-send" data-sc-send>Send</button>
</div>
</body>
